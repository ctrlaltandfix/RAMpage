name: Build RAMpage v1.4.0 with clearer updater version

on:
  push:
    branches: [chatgpt-updater-version-v1.4.0]
    paths: ['.github/workflows/build-rampage-v1.4.0.yml', 'tests/update-version-visibility.test.js']

permissions:
  contents: write

concurrency:
  group: rampage-v1.4.0-label-fix
  cancel-in-progress: false

jobs:
  test-build-publish:
    runs-on: windows-latest
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ensure release does not already exist
        run: |
          $existing = gh release list --limit 100 --json tagName | ConvertFrom-Json
          if (@($existing | Where-Object { $_.tagName -eq 'v1.4.0' }).Count -gt 0) { throw 'Release v1.4.0 already exists, refusing overwrite.' }

      - name: Download and verify official v1.3.1 release
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -Type Directory -Force "$env:RUNNER_TEMP\old" | Out-Null
          gh release download v1.3.1 --pattern 'RAMpage-Setup-1.3.1.exe' --dir "$env:RUNNER_TEMP\old"
          if ($LASTEXITCODE -ne 0) { throw 'Download v1.3.1 failed' }
          gh release download v1.3.1 --pattern 'RAMpage-Setup-1.3.1.exe.sha256' --dir "$env:RUNNER_TEMP\old"
          if ($LASTEXITCODE -ne 0) { throw 'Download v1.3.1 checksum failed' }
          $exe = "$env:RUNNER_TEMP\old\RAMpage-Setup-1.3.1.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '4ce7764a1dc969751895679cfdc88087afca853e0f9bfb6794945e97d4141237') {
            throw "Unexpected source binary digest $hash"
          }
          $sum = [regex]::Match((Get-Content "$exe.sha256" -Raw),'(?i)[a-f0-9]{64}').Value.ToLowerInvariant()
          if ($sum -ne $hash) { throw 'Official release SHA-256 file mismatch' }
          Write-Host "Verified official v1.3.1 digest: $hash"

      - name: Repackage authentic v1.3.1 app as v1.4.0
        run: |
          $ErrorActionPreference = 'Stop'
          $expanded = "$env:RUNNER_TEMP\expanded"
          New-Item -ItemType Directory -Force $expanded | Out-Null
          & 7z x '-y' "-o$expanded" "$env:RUNNER_TEMP\old\RAMpage-Setup-1.3.1.exe"
          if ($LASTEXITCODE -ne 0) { throw '7z source-installer extraction failed' }
          $candidates = @(Get-ChildItem $expanded -Recurse -File -Filter 'RAMpage.exe' | Where-Object {
            Test-Path (Join-Path $_.DirectoryName 'resources\app.asar') })
          if ($candidates.Count -ne 1) { throw "Expected 1 Electron app, got $($candidates.Count)" }
          $target = "$env:GITHUB_WORKSPACE\dist\win-unpacked"
          New-Item -ItemType Directory -Force $target | Out-Null
          Copy-Item -Path "$($candidates[0].DirectoryName)\*" -Destination $target -Recurse -Force
          $unpacked = "$env:RUNNER_TEMP\source"
          & npx --yes '@electron/asar@3.4.1' extract "$target\resources\app.asar" $unpacked
          if ($LASTEXITCODE -ne 0) { throw 'ASAR extraction failed' }
          $manifest = "$unpacked\package.json"
          $pkg = Get-Content $manifest -Raw | ConvertFrom-Json
          if ($pkg.version -ne '1.3.1') { throw "Unexpected embedded version $($pkg.version)" }
          if ($pkg.updates.github -ne 'ctrlaltandfix/RAMpage') { throw 'Wrong in-app updater feed' }
          # The official v1.3.1 packaged application already contains the ShadPS4 overlay fix.
          # Pin its renderer before correcting the version label.
          $rendererFile = Join-Path $unpacked 'src\renderer\app.js'
          $rendererHash = (Get-FileHash $rendererFile -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($rendererHash -ne '210656ceda23e36ab36ffce376bd60f3f1ddf9d86fdf73034bac4594e18ea1ca') {
            throw "Unexpected v1.3.1 renderer source SHA256: $rendererHash"
          }
          $rendererText = [System.IO.File]::ReadAllText($rendererFile)
          $oldLine = @($rendererText -split '\r?\n' | Where-Object { $_ -match '^function updLabel\(x\)' })
          if ($oldLine.Count -ne 1 -or !$oldLine[0].Contains('shortVer(x)')) {
            throw 'Expected the old 1.3 update-label function, found different code'
          }
          $newLine = "function updLabel(x) { const version = String(x || '').trim().replace(/^v/i, ''); return version ? ' ' + esc(version) : ''; }"
          [System.IO.File]::WriteAllText($rendererFile, $rendererText.Replace($oldLine[0], $newLine))
          $env:RAMPAGE_APP_ROOT = $unpacked
          node --test 'tests/update-version-visibility.test.js'
          if ($LASTEXITCODE -ne 0) { throw 'Update display/regression tests failed' }
          $pkg.version = '1.4.0'
          [System.IO.File]::WriteAllText($manifest, ($pkg | ConvertTo-Json -Depth 100))
          foreach ($source in @('src\main.js','src\quick-access-policy.js','src\storage.js','src\updater.js','src\renderer\app.js')) {
            & node --check "$unpacked\$source"
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax check failed: $source" }
          }
          & npx --yes '@electron/asar@3.4.1' pack $unpacked "$target\resources\app.asar"
          if ($LASTEXITCODE -ne 0) { throw 'ASAR repack failed' }
          & npx --yes '@electron/asar@3.4.1' extract "$target\resources\app.asar" "$env:RUNNER_TEMP\verify"
          if ($LASTEXITCODE -ne 0) { throw 'ASAR verification extract failed' }
          $checkVer = (Get-Content "$env:RUNNER_TEMP\verify\package.json" -Raw | ConvertFrom-Json).version
          if ($checkVer -ne '1.4.0') { throw "Repacked application version was $checkVer" }
          Write-Host "Repacked official Electron app with new version: $checkVer"

      - name: Build Windows updater-compatible installer
        run: |
          $ErrorActionPreference = 'Stop'
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS install failed' }
          $script = Get-Content '.github/patches/rampage-0.2.5-installer.nsi' -Raw
          if (!$script.Contains('/RELAUNCH') -or !$script.Contains('installed-build.txt') -or
              !$script.Contains('Preserve $APPDATA')) { throw 'Base installer lacks safe update facilities' }
          $script = $script.Replace('0.2.5','1.4.0').Replace('0.2 Beta','1.4 Beta')
          $script = $script.Replace('RAMpage-Setup-0.2.exe','RAMpage-Setup-1.4.exe')
          $script = $script.Replace('..\..\dist\','dist\')
          if (!$script.Contains('VIProductVersion "1.4.0.0"') -or
              !$script.Contains('FileWrite $0 "1.4.0"')) { throw 'Version substitution failed' }
          [System.IO.File]::WriteAllText('rampage-1.4-installer.nsi',$script)
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (!(Test-Path $nsis)) { $nsis = (Get-Command makensis -ErrorAction Stop).Source }
          & $nsis -V3 -INPUTCHARSET UTF8 'rampage-1.4-installer.nsi'
          if ($LASTEXITCODE -ne 0) { throw 'NSIS compilation failed' }
          $file = 'dist\RAMpage-Setup-1.4.exe'
          if (!(Test-Path $file) -or (Get-Item $file).Length -lt 100000000) {
            throw 'New installer invalid or unexpectedly small'
          }
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$file.sha256", "$hash  RAMpage-Setup-1.4.exe"+[Environment]::NewLine)
          Write-Host "Version 1.4 Windows installer SHA256: $hash"

      - name: Test real 1.3.1 to 1.4.0 in-place silent install on Windows
        run: |
          $ErrorActionPreference = 'Stop'
          $installed = "$env:LOCALAPPDATA\Programs\RAMpage"
          $roaming = "$env:APPDATA\RAMpage"
          $local = "$env:LOCALAPPDATA\RAMpage\data"
          New-Item -Type Directory -Force $roaming,$local | Out-Null
          $marker = [guid]::NewGuid().ToString()
          Set-Content "$roaming\upgrade-sentinel.txt" $marker
          Set-Content "$local\upgrade-sentinel.txt" $marker
          $oldInstall = Start-Process "$env:RUNNER_TEMP\old\RAMpage-Setup-1.3.1.exe" -ArgumentList '/S' -Wait -PassThru
          if ($oldInstall.ExitCode -ne 0) { throw "Old install failed with $($oldInstall.ExitCode)" }
          if (!(Test-Path "$installed\RAMpage.exe")) { throw 'v1.3.1 installation missing' }
          $upgrade = Start-Process "$env:GITHUB_WORKSPACE\dist\RAMpage-Setup-1.4.exe" -ArgumentList '/S' -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) { throw "v1.4.0 update failed with $($upgrade.ExitCode)" }
          if ((Get-Content "$installed\installed-build.txt" -Raw).Trim() -ne '1.4.0') {
            throw 'Installed-build marker is incorrect'
          }
          & npx --yes '@electron/asar@3.4.1' extract "$installed\resources\app.asar" "$env:RUNNER_TEMP\installed"
          if ($LASTEXITCODE -ne 0) { throw 'Installed app.asar cannot be verified' }
          $installedVer = (Get-Content "$env:RUNNER_TEMP\installed\package.json" -Raw | ConvertFrom-Json).version
          if ($installedVer -ne '1.4.0') { throw "Installed application version is $installedVer" }
          foreach ($dir in @($roaming,$local)) {
            if ((Get-Content "$dir\upgrade-sentinel.txt" -Raw).Trim() -ne $marker) {
              throw "User data was changed or lost in $dir"
            }
          }
          Write-Host 'PASSED: in-place Windows upgrade 1.3.1 -> 1.4.0, app version, marker and user data preserved'

      - name: Publish version 1.4.0 only after installer tests pass
        run: |
          $ErrorActionPreference = 'Stop'
          $existing = gh release list --limit 100 --json tagName | ConvertFrom-Json
          if (@($existing | Where-Object { $_.tagName -eq 'v1.4.0' }).Count -gt 0) { throw 'Existing release may not be overwritten' }
          @'
          ## RAMpage 1.4 Beta — clear update version labels

          This release includes the ShadPS4 Quick Access overlay improvement from v1.3.1.
          The update screen now displays the full available version number rather
          than hiding patch updates (for example, it displays v1.4.1 instead of v1.4).

          Published as v1.4.0 so RAMpage 1.3 users clearly see Version 1.4
          available, even before their installed app receives the display fix.

          Version 1.4.0 was rebuilt from the official verified v1.3.1 app.
          Tested: in-app update detection, version labels, Windows setup,
          in-place upgrade from 1.3.1, and preservation of RAMpage data.
          '@ | Set-Content 'release-notes-v1.4.md'
          gh release create v1.4.0 'dist/RAMpage-Setup-1.4.exe' 'dist/RAMpage-Setup-1.4.exe.sha256' --title 'RAMpage 1.4.0 Beta' --notes-file 'release-notes-v1.4.md' --target main --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub publication failed' }

      - name: Verify published release through authenticated GitHub API
        run: |
          $ErrorActionPreference = 'Stop'
          $release = $null
          for ($i = 0; $i -lt 6; $i++) {
            $release = gh api "repos/$env:GH_REPO/releases/latest" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'GitHub release check failed' }
            if ($release.tag_name -eq 'v1.4.0') { break }
            Start-Sleep -Seconds 5
          }
          if ($release.tag_name -ne 'v1.4.0') { throw "Latest release is $($release.tag_name), not v1.4.0" }
          $exe = @($release.assets | Where-Object { $_.name -eq 'RAMpage-Setup-1.4.exe' })
          $sha = @($release.assets | Where-Object { $_.name -eq 'RAMpage-Setup-1.4.exe.sha256' })
          if ($exe.Count -ne 1 -or $sha.Count -ne 1 -or $exe[0].size -lt 100000000) {
            throw 'Latest-release installer or checksum is missing'
          }
          Write-Host 'PASS: v1.4.0 is latest release and installer+checksum are available'
