name: RAMpage v1.6.7 Hydra Per-Game Web Search and Installer Status

on:
  push:
    branches: [chatgpt-web-hydra-download-search-v1.6.7]
    paths: ['.github/workflows/build-rampage-v1.6.7.yml']

permissions:
  contents: write

concurrency:
  group: rampage-hydra-web-search-v1.6.7
  cancel-in-progress: false

jobs:
  test-build-publish:
    runs-on: windows-latest
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Both RAMpage game views offer the same Hydra download handoff.
      - name: Check web Hydra download search, installation status and safe UI tests
        run: |
          $ErrorActionPreference='Stop'
          foreach($file in @('scripts\apply-web-hydra-download-search.js','tests\web-hydra-download-search.test.js')){
            node --check $file
            if($LASTEXITCODE -ne 0){throw "Invalid web feature code $file"}
          }

      - name: Ensure release does not already exist
        run: |
          $existing = gh release list --limit 100 --json tagName | ConvertFrom-Json
          if (@($existing | Where-Object { $_.tagName -eq 'v1.6.7' }).Count -gt 0) { throw 'Release v1.6.7 already exists, refusing overwrite.' }

      - name: Download and verify official v1.6.6 release
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -Type Directory -Force "$env:RUNNER_TEMP\old" | Out-Null
          gh release download v1.6.6 --pattern 'RAMpage-Setup-1.6.6.exe' --dir "$env:RUNNER_TEMP\old"
          if ($LASTEXITCODE -ne 0) { throw 'Download v1.6.6 failed' }
          gh release download v1.6.6 --pattern 'RAMpage-Setup-1.6.6.exe.sha256' --dir "$env:RUNNER_TEMP\old"
          if ($LASTEXITCODE -ne 0) { throw 'Download v1.6.6 checksum failed' }
          $exe = "$env:RUNNER_TEMP\old\RAMpage-Setup-1.6.6.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '8b182417ba860191c6df6492471de276e6d7541e2e60b10b95716b9556644904') {
            throw "Unexpected source binary digest $hash"
          }
          $sum = [regex]::Match((Get-Content "$exe.sha256" -Raw),'(?i)[a-f0-9]{64}').Value.ToLowerInvariant()
          if ($sum -ne $hash) { throw 'Official release SHA-256 file mismatch' }
          Write-Host "Verified official v1.6.6 digest: $hash"

      - name: Repackage authentic v1.6.6 app as v1.6.7
        run: |
          $ErrorActionPreference = 'Stop'
          $expanded = "$env:RUNNER_TEMP\expanded"
          New-Item -ItemType Directory -Force $expanded | Out-Null
          & 7z x '-y' "-o$expanded" "$env:RUNNER_TEMP\old\RAMpage-Setup-1.6.6.exe"
          if ($LASTEXITCODE -ne 0) { throw '7z source-installer extraction failed' }
          $candidates = @(Get-ChildItem $expanded -Recurse -File -Filter 'RAMpage.exe' | Where-Object {
            Test-Path (Join-Path $_.DirectoryName 'resources\app.asar') })
          if ($candidates.Count -ne 1) { throw "Expected 1 Electron app, got $($candidates.Count)" }
          $target = "$env:GITHUB_WORKSPACE\dist\win-unpacked"
          New-Item -ItemType Directory -Force $target | Out-Null
          Copy-Item -Path "$($candidates[0].DirectoryName)\*" -Destination $target -Recurse -Force
          $unpacked = "$env:RUNNER_TEMP\source"
          & npx --yes '@electron/asar@3.4.1' extract "$target\resources\app.asar" $unpacked
          if ($LASTEXITCODE -ne 0) { throw 'ASAR extraction failed' }
          $manifest = "$unpacked\package.json"
          $pkg = Get-Content $manifest -Raw | ConvertFrom-Json
          if ($pkg.version -ne '1.6.6') { throw "Unexpected embedded version $($pkg.version)" }
          if ($pkg.updates.github -ne 'ctrlaltandfix/RAMpage') { throw 'Wrong in-app updater feed' }
          # Authentic SHA256-pinned 1.6.6 contains the fully authenticated
          # Hydra web library and durable Add a Download placeholder feature.
          $before=[System.IO.File]::ReadAllText("$unpacked\src\main.js")
          if(!$before.Contains("ipcMain.handle('hydra:draft-create'") -or
             !$before.Contains("ipcMain.handle('remote:tunnel-start'") -or
             !$before.Contains("ipcMain.handle('hydra:remote-configure'") -or
             !$before.Contains('ShadPS4 foreground release result: ')){
            throw 'Original 1.6.6 app does not contain required existing integrations'
          }
          $mainBefore=(Get-FileHash "$unpacked\src\main.js" -Algorithm SHA256).Hash
          $serverBefore=(Get-FileHash "$unpacked\src\remote-library.js" -Algorithm SHA256).Hash
          $updaterBefore=(Get-FileHash "$unpacked\src\updater.js" -Algorithm SHA256).Hash
          $providerBefore=(Get-FileHash "$unpacked\src\hydra-remote-provider.js" -Algorithm SHA256).Hash
          $storageBefore=(Get-FileHash "$unpacked\src\storage.js" -Algorithm SHA256).Hash
          node 'scripts/apply-web-hydra-download-search.js' $unpacked
          if($LASTEXITCODE -ne 0){throw 'Per-game Hydra download search UI patch failed'}
          $env:RAMPAGE_APP_ROOT=$unpacked
          node --test 'tests/web-hydra-download-search.test.js'
          if($LASTEXITCODE -ne 0){throw 'Hydra per-game download search and installer status tests failed'}
          # This is a read-only UI change: all service IPC, authentication, journal,
          # updater, Hydra record parsing and ShadPS4 modules MUST remain byte-identical.
          foreach($item in @(
            @{file='src\main.js';sha=$mainBefore},
            @{file='src\remote-library.js';sha=$serverBefore},
            @{file='src\updater.js';sha=$updaterBefore},
            @{file='src\hydra-remote-provider.js';sha=$providerBefore},
            @{file='src\storage.js';sha=$storageBefore}
          )){
            if((Get-FileHash "$unpacked\$($item.file)" -Algorithm SHA256).Hash -ne $item.sha){
              throw "Unexpected functional change to $($item.file)"
            }
          }
          $pkg.version = '1.6.7'
          [System.IO.File]::WriteAllText($manifest, ($pkg | ConvertTo-Json -Depth 100))
          foreach ($source in @('src\hydra-remote-provider.js','src\remote-quick-tunnel.js','src\main.js','src\remote-library.js','src\remote\client.js','src\preload.js','src\quick-access-presenter.js','src\quick-access-policy.js','src\storage.js','src\updater.js','src\renderer\app.js')) {
            & node --check "$unpacked\$source"
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax check failed: $source" }
          }
          & npx --yes '@electron/asar@3.4.1' pack $unpacked "$target\resources\app.asar"
          if ($LASTEXITCODE -ne 0) { throw 'ASAR repack failed' }
          & npx --yes '@electron/asar@3.4.1' extract "$target\resources\app.asar" "$env:RUNNER_TEMP\verify"
          if ($LASTEXITCODE -ne 0) { throw 'ASAR verification extract failed' }
          $checkVer = (Get-Content "$env:RUNNER_TEMP\verify\package.json" -Raw | ConvertFrom-Json).version
          if ($checkVer -ne '1.6.7') { throw "Repacked application version was $checkVer" }
          $verifyMain=[System.IO.File]::ReadAllText("$env:RUNNER_TEMP\verify\src\main.js")
          if (!$verifyMain.Contains("ipcMain.handle('hydra:remote-configure'") -or
              !$verifyMain.Contains("ipcMain.handle('remote:tunnel-start'") -or
              !$verifyMain.Contains("ipcMain.handle('remote:configure'") -or
              !(Test-Path "$env:RUNNER_TEMP\verify\src\remote\index.html")) {
            throw 'Remote library was not embedded in the Electron ASAR'
          }
          $verifyText = [System.IO.File]::ReadAllText("$env:RUNNER_TEMP\verify\src\main.js")
          if (!$verifyText.Contains('ShadPS4 foreground release result: ')) { throw 'Packaged v1.6.7 lost the ShadPS4 fix' }
          foreach($file in @('src\renderer\app.js','src\remote\client.js','src\remote\index.html')){
            $text=[System.IO.File]::ReadAllText("$env:RUNNER_TEMP\verify\$file")
            if(!$text.Contains('pirated or otherwise unauthorised games or content') -and
               $file -ne 'src\remote\client.js'){
              throw "No Hydra disclaimer found in packaged $file"
            }
          }
          $indexServer=[System.IO.File]::ReadAllText("$env:RUNNER_TEMP\verify\src\remote-library.js")
          if(!$indexServer.Contains("pathname==='/api/hydra/index'")){throw 'Account-aware remote index not packaged'}
          $indexProvider=[System.IO.File]::ReadAllText("$env:RUNNER_TEMP\verify\src\hydra-remote-provider.js")
          if(!$indexProvider.Contains('getIndex(query')){throw 'Hydra account-gated index provider missing'}
          $mainPackaged=[System.IO.File]::ReadAllText("$env:RUNNER_TEMP\verify\src\main.js")
          $rendererPackaged=[System.IO.File]::ReadAllText("$env:RUNNER_TEMP\verify\src\renderer\app.js")
          if(!$mainPackaged.Contains("ipcMain.handle('hydra:draft-create'") -or
             !$mainPackaged.Contains("ipcMain.handle('hydra:draft-open'") -or
             !$rendererPackaged.Contains("Download a Game")){
             throw 'Packaged build missing gated Hydra Add Game wizard or handler'
          }
          $webSource=[System.IO.File]::ReadAllText("$env:RUNNER_TEMP\verify\src\remote-library.js")
          $remoteHtml=[System.IO.File]::ReadAllText("$env:RUNNER_TEMP\verify\src\remote\index.html")
          $remoteClient=[System.IO.File]::ReadAllText("$env:RUNNER_TEMP\verify\src\remote\client.js")
          if(!$webSource.Contains("pathname==='/api/hydra/draft'") -or
             !$webSource.Contains("session.hydraDraftTimes") -or
             !$remoteHtml.Contains('id="hydra-add-download" hidden') -or
             !$remoteClient.Contains('refreshHydraDraftStatus')){
            throw 'Packaged authenticated, activation-gated Hydra remote draft UI missing'
          }
          if(!$remoteHtml.Contains('id="hydra-game-search"') -or
             !$remoteHtml.Contains('id="hydra-game-status"') -or
             !$remoteClient.Contains("async function searchHydraDownloads()") -or
             !$remoteClient.Contains("async function hydraDownloadStatus()") -or
             !$remoteHtml.Contains('id="hydra-draft-search"')){
            throw 'Per-game Hydra search / installer status tools missing from packed web app'
          }
          Write-Host "Verified v$checkVer web search and safe install status, plus original Hydra and ShadPS4 features"

      - name: Build Windows updater-compatible installer
        run: |
          $ErrorActionPreference = 'Stop'
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS install failed' }
          $script = Get-Content '.github/patches/rampage-0.2.5-installer.nsi' -Raw
          if (!$script.Contains('/RELAUNCH') -or !$script.Contains('installed-build.txt') -or
              !$script.Contains('Preserve $APPDATA')) { throw 'Base installer lacks safe update facilities' }
          $script = $script.Replace('0.2.5','1.6.7').Replace('0.2 Beta','1.6 Beta')
          $script = $script.Replace('RAMpage-Setup-0.2.exe','RAMpage-Setup-1.6.7.exe')
          $script = $script.Replace('..\..\dist\','dist\')
          if (!$script.Contains('VIProductVersion "1.6.7.0"') -or
              !$script.Contains('FileWrite $0 "1.6.7"')) { throw 'Version substitution failed' }
          [System.IO.File]::WriteAllText('rampage-1.6-installer.nsi',$script)
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (!(Test-Path $nsis)) { $nsis = (Get-Command makensis -ErrorAction Stop).Source }
          & $nsis -V3 -INPUTCHARSET UTF8 'rampage-1.6-installer.nsi'
          if ($LASTEXITCODE -ne 0) { throw 'NSIS compilation failed' }
          $file = 'dist\RAMpage-Setup-1.6.7.exe'
          if (!(Test-Path $file) -or (Get-Item $file).Length -lt 100000000) {
            throw 'New installer invalid or unexpectedly small'
          }
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$file.sha256", "$hash  RAMpage-Setup-1.6.7.exe"+[Environment]::NewLine)
          Write-Host "Version 1.6.7 Windows installer SHA256: $hash"

      - name: Test real 1.6.6 to 1.6.7 in-place silent install on Windows
        run: |
          $ErrorActionPreference = 'Stop'
          $installed = "$env:LOCALAPPDATA\Programs\RAMpage"
          $roaming = "$env:APPDATA\RAMpage"
          $local = "$env:LOCALAPPDATA\RAMpage\data"
          New-Item -Type Directory -Force $roaming,$local | Out-Null
          $marker = [guid]::NewGuid().ToString()
          Set-Content "$roaming\upgrade-sentinel.txt" $marker
          Set-Content "$local\upgrade-sentinel.txt" $marker
          $oldInstall = Start-Process "$env:RUNNER_TEMP\old\RAMpage-Setup-1.6.6.exe" -ArgumentList '/S' -Wait -PassThru
          if ($oldInstall.ExitCode -ne 0) { throw "Old install failed with $($oldInstall.ExitCode)" }
          if (!(Test-Path "$installed\RAMpage.exe")) { throw 'v1.6.6 installation missing' }
          $upgrade = Start-Process "$env:GITHUB_WORKSPACE\dist\RAMpage-Setup-1.6.7.exe" -ArgumentList '/S' -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) { throw "v1.6.7 update failed with $($upgrade.ExitCode)" }
          if ((Get-Content "$installed\installed-build.txt" -Raw).Trim() -ne '1.6.7') {
            throw 'Installed-build marker is incorrect'
          }
          & npx --yes '@electron/asar@3.4.1' extract "$installed\resources\app.asar" "$env:RUNNER_TEMP\installed"
          if ($LASTEXITCODE -ne 0) { throw 'Installed app.asar cannot be verified' }
          $installedVer = (Get-Content "$env:RUNNER_TEMP\installed\package.json" -Raw | ConvertFrom-Json).version
          if ($installedVer -ne '1.6.7') { throw "Installed application version is $installedVer" }
          if(!(Test-Path "$installed\tools\cloudflared.exe")){throw 'Bundled Cloudflare tool missing'}
          $tunnelHash=(Get-FileHash "$installed\tools\cloudflared.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          if($tunnelHash -ne '4d2490e74082c5d48dbfedaf92576fa5bd1702379ab88eb7faa0cfbe8dc891b6'){throw 'Installed tunnelling executable digest mismatch'}
          if(!(Test-Path "$env:RUNNER_TEMP\installed\src\remote-quick-tunnel.js")){throw 'Installed app missing Quick Tunnel manager'}
          if(!(Test-Path "$installed\tools\cloudflared.exe")){throw 'Previous secure remote access functionality not preserved'}
          if(!(Test-Path "$installed\tools\hydra-bridge\node.exe") -or
             !(Test-Path "$installed\tools\hydra-bridge\reader.js")){throw 'Hydra reader absent from installed app'}
          if(!(Test-Path "$env:RUNNER_TEMP\installed\src\hydra-remote-provider.js")){throw 'Hydra opt-in module absent from packaged app'}
          $installedClient=[System.IO.File]::ReadAllText("$env:RUNNER_TEMP\installed\src\remote\client.js")
          $installedHtml=[System.IO.File]::ReadAllText("$env:RUNNER_TEMP\installed\src\remote\index.html")
          if(!$installedClient.Contains('async function searchHydraDownloads()') -or
             !$installedHtml.Contains('id="hydra-game-tools" hidden') -or
             !$installedHtml.Contains('id="hydra-game-status"')){
            throw 'Windows installed app missing Hydra search and status controls'
          }
          $installedWeb=[System.IO.File]::ReadAllText("$env:RUNNER_TEMP\installed\src\remote-library.js")
          $installedUi=[System.IO.File]::ReadAllText("$env:RUNNER_TEMP\installed\src\remote\index.html")
          if(!$installedWeb.Contains("pathname==='/api/hydra/draft'") -or
             !$installedUi.Contains('id="hydra-draft-modal"')) {
            throw 'Windows-installed RAMpage lacks authenticated web download placeholder flow'
          }
          $installedMain=[System.IO.File]::ReadAllText("$env:RUNNER_TEMP\installed\src\main.js")
          $installedWizard=[System.IO.File]::ReadAllText("$env:RUNNER_TEMP\installed\src\renderer\app.js")
          if(!$installedMain.Contains("ipcMain.handle('hydra:draft-create'") -or
             !$installedWizard.Contains('Create empty game entry') -or
             !(Test-Path "$env:RUNNER_TEMP\installed\src\hydra-download-draft.js")){
            throw 'Installed Windows app missing Hydra wizard or safe game placeholder helper'
          }
          $installedWeb=[System.IO.File]::ReadAllText("$env:RUNNER_TEMP\installed\src\remote-library.js")
          if(!$installedWeb.Contains("pathname==='/api/hydra/index'")){throw 'Installer missing protected Hydra search endpoint'}
          $installedReader=[System.IO.File]::ReadAllText("$installed\tools\hydra-bridge\reader.js")
          if(!$installedReader.Contains('sessionStored')){throw 'Installer missing sanitized account-state reader'}
          $settingsText=[System.IO.File]::ReadAllText("$env:RUNNER_TEMP\installed\src\renderer\app.js")
          $remoteHtml=[System.IO.File]::ReadAllText("$env:RUNNER_TEMP\installed\src\remote\index.html")
          if(!$settingsText.Contains('Hydra Launcher is an alternative game launcher') -or
             !$remoteHtml.Contains('It does not provide, download, distribute')) {
            throw 'Shipped Windows app missing the Hydra disclaimer'
          }
          $mainInstalled=[System.IO.File]::ReadAllText("$env:RUNNER_TEMP\installed\src\main.js")
          if(!$mainInstalled.Contains("ipcMain.handle('hydra:remote-configure'")){throw 'Desktop Hydra opt-in missing'}
          foreach ($dir in @($roaming,$local)) {
            if ((Get-Content "$dir\upgrade-sentinel.txt" -Raw).Trim() -ne $marker) {
              throw "User data was changed or lost in $dir"
            }
          }
          Write-Host 'PASSED: in-place Windows upgrade 1.6.6 -> 1.6.7, app version, marker and user data preserved'

      - name: Publish version 1.6.7 only after installer tests pass
        run: |
          $ErrorActionPreference = 'Stop'
          $existing = gh release list --limit 100 --json tagName | ConvertFrom-Json
          if (@($existing | Where-Object { $_.tagName -eq 'v1.6.7' }).Count -gt 0) { throw 'Existing release may not be overwritten' }
          @'
          ## RAMpage 1.6.7 Beta — Hydra Web Search for Downloads

          Once a Hydra placeholder has been created in the password-
          protected RAMpage web library, open the game and use:

          - **Search for Downloads** — search Hydra's *locally cached*
            catalogue by title and see indexed titles/new-option counts.
          - **Download / Installer Status** — see any matching existing
            Hydra download queue states and progress from its last sync.
          - **Install Using Hydra** — clear instructions for continuing
            the actual download and installer steps on the gaming PC.
          - **Copy Title** — copy the chosen game title to your device.

          **Search for Downloads** is also offered immediately after
          creating a Hydra game using **+ Add a Download** on the website.

          The controls are only visible for Not installed Hydra game
          placeholders and only while Hydra is enabled in desktop Settings.
          Password login and existing CSRF, origin, rate-limit and session
          protections are unchanged, as are existing metadata edits.

          IMPORTANT: Hydra's live download search and installer are internal
          Electron functions without a supported third-party remote API.
          No download/installer is started from the RAMpage browser.
          Options and statuses come from existing local cached Hydra
          records only. Hydra credentials and source URLs stay private.

          Original one-click Cloudflare, ShadPS4, Hydra desktop wizard,
          updater, game library data and unauthorised-content disclaimer
          are preserved. Windows CI checks functionality and in-place upgrade.
          '@ | Set-Content 'release-notes-v1.6.7-remote.md'
          gh release create v1.6.7 'dist/RAMpage-Setup-1.6.7.exe' 'dist/RAMpage-Setup-1.6.7.exe.sha256' --title 'RAMpage 1.6.7 Beta' --notes-file 'release-notes-v1.6.7-remote.md' --target main --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub publication failed' }

      - name: Verify published release through authenticated GitHub API
        run: |
          $ErrorActionPreference = 'Stop'
          $release = $null
          for ($i = 0; $i -lt 6; $i++) {
            $release = gh api "repos/$env:GH_REPO/releases/latest" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'GitHub release check failed' }
            if ($release.tag_name -eq 'v1.6.7') { break }
            Start-Sleep -Seconds 5
          }
          if ($release.tag_name -ne 'v1.6.7') { throw "Latest release is $($release.tag_name), not v1.6.7" }
          $exe = @($release.assets | Where-Object { $_.name -eq 'RAMpage-Setup-1.6.7.exe' })
          $sha = @($release.assets | Where-Object { $_.name -eq 'RAMpage-Setup-1.6.7.exe.sha256' })
          if ($exe.Count -ne 1 -or $sha.Count -ne 1 -or $exe[0].size -lt 100000000) {
            throw 'Latest-release installer or checksum is missing'
          }
          Write-Host 'PASS: v1.6.7 is latest release and installer+checksum are available'
