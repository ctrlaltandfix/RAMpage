name: Build and publish RAMpage 0.2.5

on:
  push:
    branches: [main]
    paths:
      - '.github/patches/v0.2.5-from-v0.2.4.patch.xz.base64'
      - '.github/patches/rampage-0.2.5-installer.nsi'
      - '.github/workflows/build-and-publish-rampage.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rampage-v0.2.5-release-current
  cancel-in-progress: true

jobs:
  windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download previous verified installer
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\previous" | Out-Null
          gh release download v0.2.4 --pattern 'RAMpage-Setup-0.2.exe' --dir "$env:RUNNER_TEMP\previous"
          if ($LASTEXITCODE -ne 0) { throw "Could not download official v0.2.4 installer" }
          if ((Get-Item "$env:RUNNER_TEMP\previous\RAMpage-Setup-0.2.exe").Length -lt 10000000) { throw "Incomplete v0.2.4 installer" }

      - name: Extract installed Electron application
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\previous-unpacked" | Out-Null
          & 7z x '-y' "-o$env:RUNNER_TEMP\previous-unpacked" "$env:RUNNER_TEMP\previous\RAMpage-Setup-0.2.exe"
          if ($LASTEXITCODE -ne 0) { throw "Could not extract the known-good Windows installer" }
          $candidates = @(Get-ChildItem -Path "$env:RUNNER_TEMP\previous-unpacked" -Recurse -File -Filter RAMpage.exe)
          $appExe = $candidates | Where-Object { Test-Path (Join-Path $_.DirectoryName 'resources\app.asar') } | Select-Object -First 1
          if (!$appExe) {
            Get-ChildItem "$env:RUNNER_TEMP\previous-unpacked" | Select-Object -First 30 | Format-Table
            throw "Installer does not expose an unpacked Electron app; refuse to publish a guessed build"
          }
          New-Item -ItemType Directory -Force 'dist\win-unpacked' | Out-Null
          Copy-Item -Path "$($appExe.DirectoryName)\*" -Destination 'dist\win-unpacked' -Recurse -Force
          if (!(Test-Path 'dist\win-unpacked\resources\app.asar')) { throw "Missing source asar" }

      - name: Decode and verify the tested 0.2.5 patch
        run: |
          $patch64 = (Get-Content '.github/patches/v0.2.5-from-v0.2.4.patch.xz.base64' -Raw) -replace '\s', ''
          if ($patch64.Length -ne 11916) { throw "Incorrect patch payload length" }
          $compressed = [Convert]::FromBase64String($patch64)
          $patchDir = "$env:RUNNER_TEMP\release-patch"
          New-Item -ItemType Directory -Force $patchDir | Out-Null
          $compressedPath = Join-Path $patchDir 'v0.2.5.patch.xz'
          [System.IO.File]::WriteAllBytes($compressedPath, $compressed)
          $hash = (Get-FileHash $compressedPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'a1b6dba558e519ae0027bae80f0ffdebb612dfe713cd26916870e84bd8864077') {
            throw "Patch checksum mismatch: $hash"
          }
          & 7z e '-y' "-o$patchDir" $compressedPath
          if ($LASTEXITCODE -ne 0) { throw "Could not decompress patch" }
          if (!(Test-Path (Join-Path $patchDir 'v0.2.5.patch'))) { throw "Patch not found after decompression" }

      - name: Patch installed app and verify all fixed source files
        run: |
          $src = "$env:RUNNER_TEMP\rampage-src"
          npx --yes '@electron/asar@3.4.1' extract 'dist\win-unpacked\resources\app.asar' $src
          if ($LASTEXITCODE -ne 0) { throw "Failed to unpack the original app" }
          Push-Location $src
          try {
            $patch = "$env:RUNNER_TEMP\release-patch\v0.2.5.patch"
            # electron-builder strips build-only package.json fields from the ASAR;
            # apply the exact tested code patch, then update packaged version separately.
            $originalPatch = Get-Content $patch -Raw
            $sourcePatchText = [regex]::Replace($originalPatch, '(?ms)^diff --git a/package\.json b/package\.json\r?\n.*?(?=^diff --git |\z)', '')
            $sourcePatch = "$env:RUNNER_TEMP\release-patch\app-source.patch"
            [System.IO.File]::WriteAllText($sourcePatch, $sourcePatchText)
            Write-Host 'Applying tested application-only patch (packaged package.json is handled separately)'
            git apply --check $sourcePatch
            if ($LASTEXITCODE -ne 0) { throw "Patch doesn't match the v0.2.4 application source" }
            git apply $sourcePatch
            if ($LASTEXITCODE -ne 0) { throw "Application patch failed" }
            $pkg = Get-Content 'package.json' -Raw | ConvertFrom-Json
            if ($pkg.version -ne '0.2.4') { throw "Expected packaged v0.2.4 before upgrading" }
            $pkg.version = '0.2.5'
            [System.IO.File]::WriteAllText((Join-Path $src 'package.json'), ($pkg | ConvertTo-Json -Depth 100))
            # The extracted release can differ in line endings or non-patched metadata
            # from the source archive, but the exact patch must apply cleanly.
            # Validate the actual recovery guarantees rather than whole-file bytes.
            $storageText = Get-Content 'src/storage.js' -Raw
            $mainText = Get-Content 'src/main.js' -Raw
            $rendererText = Get-Content 'src/renderer/app.js' -Raw
            if (!$storageText.Contains('manual-games.ndjson') -or
                !$storageText.Contains('manualDeleted') -or
                !$storageText.Contains('manualRecords')) { throw "Manual-game recovery code missing" }
            if (!$mainText.Contains('const verify = new Storage(') -or !$rendererText.Contains('added and saved')) {
              throw "Game persistence integration missing from patched app"
            }
            foreach ($path in @('src/main.js','src/storage.js','src/renderer/app.js')) {
              Write-Host "Patched $path SHA256: $((Get-FileHash $path -Algorithm SHA256).Hash)"
            }
            node --check 'src/storage.js'
            if ($LASTEXITCODE -ne 0) { throw "Invalid storage code" }
            node --check 'src/main.js'
            if ($LASTEXITCODE -ne 0) { throw "Invalid main-process code" }
            node --check 'src/renderer/app.js'
            if ($LASTEXITCODE -ne 0) { throw "Invalid renderer code" }
            $version = (node -p "require('./package.json').version").Trim()
            if ($version -ne '0.2.5') { throw "Incorrect build version" }
            npx --yes '@electron/asar@3.4.1' pack $src "$env:GITHUB_WORKSPACE\dist\win-unpacked\resources\app.asar"
            if ($LASTEXITCODE -ne 0) { throw "Failed to repack patched application" }
          } finally {
            Pop-Location
          }

      - name: Compile guarded Windows update installer
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "NSIS not installed" }
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (!(Test-Path $nsis)) { $nsis = (Get-Command makensis -ErrorAction Stop).Source }
          Copy-Item '.github/patches/rampage-0.2.5-installer.nsi' 'rampage-setup.nsi' -Force
          & $nsis -V3 -INPUTCHARSET UTF8 'rampage-setup.nsi'
          if ($LASTEXITCODE -ne 0) { throw "NSIS compile failed" }
          $exe = 'dist\RAMpage-Setup-0.2.exe'
          if (!(Test-Path $exe) -or (Get-Item $exe).Length -lt 10000000) { throw "Installer invalid or incomplete" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$exe.sha256", "$hash  RAMpage-Setup-0.2.exe"+[Environment]::NewLine)

      - name: Publish actual 0.2.5 update
        run: |
          gh release view v0.2.5 *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release already exists; refusing to overwrite" }
          gh release create v0.2.5 'dist/RAMpage-Setup-0.2.exe' 'dist/RAMpage-Setup-0.2.exe.sha256' --title 'RAMpage 0.2 Beta — build 0.2.5' --notes-file '.github/RAMpage-0.2.5-release-notes.md' --target $env:GITHUB_SHA --latest
          if ($LASTEXITCODE -ne 0) { throw "GitHub release publication failed" }
