name: RAMpage v1.6.0 Private Remote Library

on:
  push:
    branches: [chatgpt-remote-library-v1.6.0]
    paths: ['.github/workflows/build-rampage-v1.6.0.yml', '.github/patches/remote-library-feature.tar.xz.b64']

permissions:
  contents: write

concurrency:
  group: rampage-remote-library-v1.6.0
  cancel-in-progress: false

jobs:
  test-build-publish:
    runs-on: windows-latest
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Decode and check the web library source against locked digest
        run: |
          $ErrorActionPreference='Stop'
          $archive="$env:RUNNER_TEMP\remote-library-feature.tar.xz"
          $payload=(Get-Content '.github/patches/remote-library-feature.tar.xz.b64' -Raw).Trim()
          [System.IO.File]::WriteAllBytes($archive,[Convert]::FromBase64String($payload))
          $digest=(Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne 'b50a0bbd74ad4f897328974f3a1a9c590fdd62b276469434b9308ea73685cf5f') {
            throw 'Remote library feature source payload digest mismatch'
          }
          & tar -xJf $archive -C $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw 'Could not unpack remote library source bundle' }
          foreach ($path in @('src\remote-library.js','src\remote\index.html','src\remote\client.js','src\remote\style.css','scripts\apply-remote-library.js','tests\remote-library.test.js')) {
            if (!(Test-Path $path)) { throw "Feature source missing: $path" }
          }
          node --check 'src/remote-library.js'
          node --check 'scripts/apply-remote-library.js'
          node --check 'src/remote/client.js'
          node --test 'tests/remote-library.test.js'
          if ($LASTEXITCODE -ne 0) { throw 'Remote library authentication/persistence tests failed' }

      - name: Preserve readable feature source on GitHub branch
        run: |
          $ErrorActionPreference='Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/remote-library.js src/remote scripts/apply-remote-library.js tests/remote-library.test.js
          if ((git status --porcelain).Length -gt 0) {
            git commit -m "Include editable remote library source, browser UI and security tests"
            if ($LASTEXITCODE -ne 0) { throw 'Source commit failed' }
            git push origin HEAD:chatgpt-remote-library-v1.6.0
            if ($LASTEXITCODE -ne 0) { throw 'Cannot commit readable feature source to branch' }
          }

      - name: Ensure release does not already exist
        run: |
          $existing = gh release list --limit 100 --json tagName | ConvertFrom-Json
          if (@($existing | Where-Object { $_.tagName -eq 'v1.6.0' }).Count -gt 0) { throw 'Release v1.6.0 already exists, refusing overwrite.' }

      - name: Download and verify official v1.5.1 release
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -Type Directory -Force "$env:RUNNER_TEMP\old" | Out-Null
          gh release download v1.5.1 --pattern 'RAMpage-Setup-1.5.1.exe' --dir "$env:RUNNER_TEMP\old"
          if ($LASTEXITCODE -ne 0) { throw 'Download v1.5.1 failed' }
          gh release download v1.5.1 --pattern 'RAMpage-Setup-1.5.1.exe.sha256' --dir "$env:RUNNER_TEMP\old"
          if ($LASTEXITCODE -ne 0) { throw 'Download v1.5.1 checksum failed' }
          $exe = "$env:RUNNER_TEMP\old\RAMpage-Setup-1.5.1.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '2d67365d30a1c6136966ea0456b2b8ccbbcf9148b7a52067078b7bd3a1880359') {
            throw "Unexpected source binary digest $hash"
          }
          $sum = [regex]::Match((Get-Content "$exe.sha256" -Raw),'(?i)[a-f0-9]{64}').Value.ToLowerInvariant()
          if ($sum -ne $hash) { throw 'Official release SHA-256 file mismatch' }
          Write-Host "Verified official v1.5.1 digest: $hash"

      - name: Repackage authentic v1.5.1 app as v1.6.0
        run: |
          $ErrorActionPreference = 'Stop'
          $expanded = "$env:RUNNER_TEMP\expanded"
          New-Item -ItemType Directory -Force $expanded | Out-Null
          & 7z x '-y' "-o$expanded" "$env:RUNNER_TEMP\old\RAMpage-Setup-1.5.1.exe"
          if ($LASTEXITCODE -ne 0) { throw '7z source-installer extraction failed' }
          $candidates = @(Get-ChildItem $expanded -Recurse -File -Filter 'RAMpage.exe' | Where-Object {
            Test-Path (Join-Path $_.DirectoryName 'resources\app.asar') })
          if ($candidates.Count -ne 1) { throw "Expected 1 Electron app, got $($candidates.Count)" }
          $target = "$env:GITHUB_WORKSPACE\dist\win-unpacked"
          New-Item -ItemType Directory -Force $target | Out-Null
          Copy-Item -Path "$($candidates[0].DirectoryName)\*" -Destination $target -Recurse -Force
          $unpacked = "$env:RUNNER_TEMP\source"
          & npx --yes '@electron/asar@3.4.1' extract "$target\resources\app.asar" $unpacked
          if ($LASTEXITCODE -ne 0) { throw 'ASAR extraction failed' }
          $manifest = "$unpacked\package.json"
          $pkg = Get-Content $manifest -Raw | ConvertFrom-Json
          if ($pkg.version -ne '1.5.1') { throw "Unexpected embedded version $($pkg.version)" }
          if ($pkg.updates.github -ne 'ctrlaltandfix/RAMpage') { throw 'Wrong in-app updater feed' }
          # The current official 1.5.1 packaged app already contains the
          # ShadPS4 focus-handoff fix. Preserve it while adding remote access.
          $mainBefore=[System.IO.File]::ReadAllText((Join-Path $unpacked 'src\main.js'))
          if (!$mainBefore.Contains('ShadPS4 foreground release result: ')) {
            throw 'Wrong baseline: ShadPS4 fix absent from verified installer'
          }
          node 'scripts/apply-remote-library.js' $unpacked
          if ($LASTEXITCODE -ne 0) { throw 'Remote library integration failed' }
          $appRemote = Join-Path $unpacked 'src\remote-library.js'
          $appWeb = Join-Path $unpacked 'src\remote\index.html'
          if (!(Test-Path $appRemote) -or !(Test-Path $appWeb)) { throw 'Remote dashboard/server assets missing' }
          $mainAfter=[System.IO.File]::ReadAllText((Join-Path $unpacked 'src\main.js'))
          if (!$mainAfter.Contains('ShadPS4 foreground release result: ') -or
              !$mainAfter.Contains("ipcMain.handle('remote:configure'") -or
              !$mainAfter.Contains("ipcMain.handle('remote:status'")) {
            throw 'App lost ShadPS4 fix or missing remote library integration'
          }
          $pkg.version = '1.6.0'
          [System.IO.File]::WriteAllText($manifest, ($pkg | ConvertTo-Json -Depth 100))
          foreach ($source in @('src\main.js','src\remote-library.js','src\remote\client.js','src\preload.js','src\quick-access-presenter.js','src\quick-access-policy.js','src\storage.js','src\updater.js','src\renderer\app.js')) {
            & node --check "$unpacked\$source"
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax check failed: $source" }
          }
          & npx --yes '@electron/asar@3.4.1' pack $unpacked "$target\resources\app.asar"
          if ($LASTEXITCODE -ne 0) { throw 'ASAR repack failed' }
          & npx --yes '@electron/asar@3.4.1' extract "$target\resources\app.asar" "$env:RUNNER_TEMP\verify"
          if ($LASTEXITCODE -ne 0) { throw 'ASAR verification extract failed' }
          $checkVer = (Get-Content "$env:RUNNER_TEMP\verify\package.json" -Raw | ConvertFrom-Json).version
          if ($checkVer -ne '1.6.0') { throw "Repacked application version was $checkVer" }
          $verifyMain=[System.IO.File]::ReadAllText("$env:RUNNER_TEMP\verify\src\main.js")
          if (!$verifyMain.Contains("ipcMain.handle('remote:configure'") -or
              !(Test-Path "$env:RUNNER_TEMP\verify\src\remote\index.html")) {
            throw 'Remote library was not embedded in the Electron ASAR'
          }
          $verifyText = [System.IO.File]::ReadAllText("$env:RUNNER_TEMP\verify\src\main.js")
          if (!$verifyText.Contains('ShadPS4 foreground release result: ')) { throw 'Packaged v1.6.0 lost the ShadPS4 fix' }
          Write-Host "Repacked verified ShadPS4-fixed Electron app with new version: $checkVer"

      - name: Build Windows updater-compatible installer
        run: |
          $ErrorActionPreference = 'Stop'
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS install failed' }
          $script = Get-Content '.github/patches/rampage-0.2.5-installer.nsi' -Raw
          if (!$script.Contains('/RELAUNCH') -or !$script.Contains('installed-build.txt') -or
              !$script.Contains('Preserve $APPDATA')) { throw 'Base installer lacks safe update facilities' }
          $script = $script.Replace('0.2.5','1.6.0').Replace('0.2 Beta','1.6 Beta')
          $script = $script.Replace('RAMpage-Setup-0.2.exe','RAMpage-Setup-1.6.exe')
          $script = $script.Replace('..\..\dist\','dist\')
          if (!$script.Contains('VIProductVersion "1.6.0.0"') -or
              !$script.Contains('FileWrite $0 "1.6.0"')) { throw 'Version substitution failed' }
          [System.IO.File]::WriteAllText('rampage-1.6-installer.nsi',$script)
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (!(Test-Path $nsis)) { $nsis = (Get-Command makensis -ErrorAction Stop).Source }
          & $nsis -V3 -INPUTCHARSET UTF8 'rampage-1.6-installer.nsi'
          if ($LASTEXITCODE -ne 0) { throw 'NSIS compilation failed' }
          $file = 'dist\RAMpage-Setup-1.6.exe'
          if (!(Test-Path $file) -or (Get-Item $file).Length -lt 100000000) {
            throw 'New installer invalid or unexpectedly small'
          }
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$file.sha256", "$hash  RAMpage-Setup-1.6.exe"+[Environment]::NewLine)
          Write-Host "Version 1.6.0 Windows installer SHA256: $hash"

      - name: Test real 1.5.1 to 1.6.0 in-place silent install on Windows
        run: |
          $ErrorActionPreference = 'Stop'
          $installed = "$env:LOCALAPPDATA\Programs\RAMpage"
          $roaming = "$env:APPDATA\RAMpage"
          $local = "$env:LOCALAPPDATA\RAMpage\data"
          New-Item -Type Directory -Force $roaming,$local | Out-Null
          $marker = [guid]::NewGuid().ToString()
          Set-Content "$roaming\upgrade-sentinel.txt" $marker
          Set-Content "$local\upgrade-sentinel.txt" $marker
          $oldInstall = Start-Process "$env:RUNNER_TEMP\old\RAMpage-Setup-1.5.1.exe" -ArgumentList '/S' -Wait -PassThru
          if ($oldInstall.ExitCode -ne 0) { throw "Old install failed with $($oldInstall.ExitCode)" }
          if (!(Test-Path "$installed\RAMpage.exe")) { throw 'v1.5.1 installation missing' }
          $upgrade = Start-Process "$env:GITHUB_WORKSPACE\dist\RAMpage-Setup-1.6.exe" -ArgumentList '/S' -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) { throw "v1.6.0 update failed with $($upgrade.ExitCode)" }
          if ((Get-Content "$installed\installed-build.txt" -Raw).Trim() -ne '1.6.0') {
            throw 'Installed-build marker is incorrect'
          }
          & npx --yes '@electron/asar@3.4.1' extract "$installed\resources\app.asar" "$env:RUNNER_TEMP\installed"
          if ($LASTEXITCODE -ne 0) { throw 'Installed app.asar cannot be verified' }
          $installedVer = (Get-Content "$env:RUNNER_TEMP\installed\package.json" -Raw | ConvertFrom-Json).version
          if ($installedVer -ne '1.6.0') { throw "Installed application version is $installedVer" }
          foreach ($dir in @($roaming,$local)) {
            if ((Get-Content "$dir\upgrade-sentinel.txt" -Raw).Trim() -ne $marker) {
              throw "User data was changed or lost in $dir"
            }
          }
          Write-Host 'PASSED: in-place Windows upgrade 1.5.1 -> 1.6.0, app version, marker and user data preserved'

      - name: Publish version 1.6.0 only after installer tests pass
        run: |
          $ErrorActionPreference = 'Stop'
          $existing = gh release list --limit 100 --json tagName | ConvertFrom-Json
          if (@($existing | Where-Object { $_.tagName -eq 'v1.6.0' }).Count -gt 0) { throw 'Existing release may not be overwritten' }
          @'
          ## RAMpage 1.6.0 Beta — Private Remote Library

          View your RAMpage games and update metadata from a phone, laptop or
          another computer through a private URL.

          **Features**
          - All sources: Steam, Epic, GOG and manually added/emulated games
          - Search, filter installed games and browse covers
          - Edit name, favourite, hidden, notes, description, about, genres,
            developers, publishers, platforms, release date, features, website
            and an HTTPS cover artwork URL
          - Changes save into RAMpage's existing append-only journal and are
            immediately reflected in the desktop library
          - Strong password, limited login attempts, login sessions and CSRF
            protection; no raw launch/executable paths exposed

          **Set up remote access**
          1. Open RAMpage Settings > Remote library access.
          2. Enter a password of at least 16 characters and Enable access.
          3. Test on the gaming PC: http://127.0.0.1:43681/
          4. Install/sign in to Tailscale on the gaming PC and remote device.
          5. On the gaming PC run: tailscale serve --bg 43681
          6. Use the private HTTPS URL Tailscale provides from your other device.

          No public ports are opened. The service binds only 127.0.0.1.
          Never use Tailscale Funnel for your game library.
          The gaming PC and RAMpage must be running for remote access.

          Based on verified official RAMpage 1.5.1, preserving the ShadPS4
          Quick Access workaround. Windows CI validates source, authentication
          regression tests, installed app assets, upgrade, saved game data,
          and GitHub update distribution.
          '@ | Set-Content 'release-notes-v1.6.0-remote.md'
          gh release create v1.6.0 'dist/RAMpage-Setup-1.6.exe' 'dist/RAMpage-Setup-1.6.exe.sha256' --title 'RAMpage 1.6.0 Beta' --notes-file 'release-notes-v1.6.0-remote.md' --target main --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub publication failed' }

      - name: Verify published release through authenticated GitHub API
        run: |
          $ErrorActionPreference = 'Stop'
          $release = $null
          for ($i = 0; $i -lt 6; $i++) {
            $release = gh api "repos/$env:GH_REPO/releases/latest" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'GitHub release check failed' }
            if ($release.tag_name -eq 'v1.6.0') { break }
            Start-Sleep -Seconds 5
          }
          if ($release.tag_name -ne 'v1.6.0') { throw "Latest release is $($release.tag_name), not v1.6.0" }
          $exe = @($release.assets | Where-Object { $_.name -eq 'RAMpage-Setup-1.6.exe' })
          $sha = @($release.assets | Where-Object { $_.name -eq 'RAMpage-Setup-1.6.exe.sha256' })
          if ($exe.Count -ne 1 -or $sha.Count -ne 1 -or $exe[0].size -lt 100000000) {
            throw 'Latest-release installer or checksum is missing'
          }
          Write-Host 'PASS: v1.6.0 is latest release and installer+checksum are available'
