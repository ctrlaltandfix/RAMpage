name: RAMpage v1.6.2 Opt-in Hydra Remote Library Integration

on:
  push:
    branches: [chatgpt-hydra-library-integration-v1.6.2]
    paths: ['.github/workflows/build-rampage-v1.6.2.yml']

permissions:
  contents: write

concurrency:
  group: rampage-hydra-integration-v1.6.2
  cancel-in-progress: false

jobs:
  test-build-publish:
    runs-on: windows-latest
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check opt-in Hydra source and Settings patch
        run: |
          $ErrorActionPreference='Stop'
          foreach($f in @('src\hydra-bridge\reader.js','src\hydra-remote-provider.js','scripts\apply-hydra-integration.js','tests\hydra-remote.test.js')) {
            node --check $f
            if($LASTEXITCODE -ne 0){throw "Invalid Hydra source $f"}
          }
          Write-Host 'Hydra source syntax validated'

      - name: Ensure release does not already exist
        run: |
          $existing = gh release list --limit 100 --json tagName | ConvertFrom-Json
          if (@($existing | Where-Object { $_.tagName -eq 'v1.6.2' }).Count -gt 0) { throw 'Release v1.6.2 already exists, refusing overwrite.' }

      - name: Download and verify official v1.6.1 release
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -Type Directory -Force "$env:RUNNER_TEMP\old" | Out-Null
          gh release download v1.6.1 --pattern 'RAMpage-Setup-1.6.1.exe' --dir "$env:RUNNER_TEMP\old"
          if ($LASTEXITCODE -ne 0) { throw 'Download v1.6.1 failed' }
          gh release download v1.6.1 --pattern 'RAMpage-Setup-1.6.1.exe.sha256' --dir "$env:RUNNER_TEMP\old"
          if ($LASTEXITCODE -ne 0) { throw 'Download v1.6.1 checksum failed' }
          $exe = "$env:RUNNER_TEMP\old\RAMpage-Setup-1.6.1.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'fc96392630f6d0c2161c77176ea33ef39fedca3eafdbc4ea0d2c759973a2d97c') {
            throw "Unexpected source binary digest $hash"
          }
          $sum = [regex]::Match((Get-Content "$exe.sha256" -Raw),'(?i)[a-f0-9]{64}').Value.ToLowerInvariant()
          if ($sum -ne $hash) { throw 'Official release SHA-256 file mismatch' }
          Write-Host "Verified official v1.6.1 digest: $hash"

      - name: Repackage authentic v1.6.1 app as v1.6.2
        run: |
          $ErrorActionPreference = 'Stop'
          $expanded = "$env:RUNNER_TEMP\expanded"
          New-Item -ItemType Directory -Force $expanded | Out-Null
          & 7z x '-y' "-o$expanded" "$env:RUNNER_TEMP\old\RAMpage-Setup-1.6.1.exe"
          if ($LASTEXITCODE -ne 0) { throw '7z source-installer extraction failed' }
          $candidates = @(Get-ChildItem $expanded -Recurse -File -Filter 'RAMpage.exe' | Where-Object {
            Test-Path (Join-Path $_.DirectoryName 'resources\app.asar') })
          if ($candidates.Count -ne 1) { throw "Expected 1 Electron app, got $($candidates.Count)" }
          $target = "$env:GITHUB_WORKSPACE\dist\win-unpacked"
          New-Item -ItemType Directory -Force $target | Out-Null
          Copy-Item -Path "$($candidates[0].DirectoryName)\*" -Destination $target -Recurse -Force
          $unpacked = "$env:RUNNER_TEMP\source"
          & npx --yes '@electron/asar@3.4.1' extract "$target\resources\app.asar" $unpacked
          if ($LASTEXITCODE -ne 0) { throw 'ASAR extraction failed' }
          $manifest = "$unpacked\package.json"
          $pkg = Get-Content $manifest -Raw | ConvertFrom-Json
          if ($pkg.version -ne '1.6.1') { throw "Unexpected embedded version $($pkg.version)" }
          if ($pkg.updates.github -ne 'ctrlaltandfix/RAMpage') { throw 'Wrong in-app updater feed' }
          $before=[System.IO.File]::ReadAllText((Join-Path $unpacked 'src\main.js'))
          if(!$before.Contains('ShadPS4 foreground release result: ') -or
             !$before.Contains("ipcMain.handle('remote:tunnel-start'") -or
             !$before.Contains("ipcMain.handle('remote:configure'")) {
            throw 'Authentic 1.6.1 baseline lacks Quick Tunnel, web library, or ShadPS4 fixes'
          }
          node 'scripts/apply-hydra-integration.js' $unpacked
          if($LASTEXITCODE -ne 0){throw 'Hydra web library integration failed'}
          $after=[System.IO.File]::ReadAllText((Join-Path $unpacked 'src\main.js'))
          if(!$after.Contains("ipcMain.handle('hydra:remote-configure'") -or
             !$after.Contains("ipcMain.handle('remote:tunnel-start'") -or
             !$after.Contains('ShadPS4 foreground release result: ')) {
            throw 'Expected Hydra integration missing or current functionality was removed'
          }
          $remoteService=[System.IO.File]::ReadAllText((Join-Path $unpacked 'src\remote-library.js'))
          if(!$remoteService.Contains("this.requireSession(req)") -or
             !$remoteService.Contains('this.checkOrigin(req)')) {
            throw 'Authentication and request-origin checks are missing'
          }
          $pkg.version = '1.6.2'
          [System.IO.File]::WriteAllText($manifest, ($pkg | ConvertTo-Json -Depth 100))
          foreach ($source in @('src\hydra-remote-provider.js','src\remote-quick-tunnel.js','src\main.js','src\remote-library.js','src\remote\client.js','src\preload.js','src\quick-access-presenter.js','src\quick-access-policy.js','src\storage.js','src\updater.js','src\renderer\app.js')) {
            & node --check "$unpacked\$source"
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax check failed: $source" }
          }
          & npx --yes '@electron/asar@3.4.1' pack $unpacked "$target\resources\app.asar"
          if ($LASTEXITCODE -ne 0) { throw 'ASAR repack failed' }
          & npx --yes '@electron/asar@3.4.1' extract "$target\resources\app.asar" "$env:RUNNER_TEMP\verify"
          if ($LASTEXITCODE -ne 0) { throw 'ASAR verification extract failed' }
          $checkVer = (Get-Content "$env:RUNNER_TEMP\verify\package.json" -Raw | ConvertFrom-Json).version
          if ($checkVer -ne '1.6.2') { throw "Repacked application version was $checkVer" }
          $verifyMain=[System.IO.File]::ReadAllText("$env:RUNNER_TEMP\verify\src\main.js")
          if (!$verifyMain.Contains("ipcMain.handle('hydra:remote-configure'") -or
              !$verifyMain.Contains("ipcMain.handle('remote:tunnel-start'") -or
              !$verifyMain.Contains("ipcMain.handle('remote:configure'") -or
              !(Test-Path "$env:RUNNER_TEMP\verify\src\remote\index.html")) {
            throw 'Remote library was not embedded in the Electron ASAR'
          }
          $verifyText = [System.IO.File]::ReadAllText("$env:RUNNER_TEMP\verify\src\main.js")
          if (!$verifyText.Contains('ShadPS4 foreground release result: ')) { throw 'Packaged v1.6.2 lost the ShadPS4 fix' }
          Write-Host "Repacked verified ShadPS4-fixed Electron app with new version: $checkVer"

      - name: Bundle isolated Node reader for Hydra's LevelDB game records
        run: |
          $ErrorActionPreference='Stop'
          $bridge="$env:GITHUB_WORKSPACE\dist\win-unpacked\tools\hydra-bridge"
          New-Item -ItemType Directory -Force $bridge | Out-Null
          Copy-Item (Get-Command node).Source "$bridge\node.exe"
          Copy-Item 'src\hydra-bridge\reader.js' "$bridge\reader.js"
          # Exact dependency: Hydra uses classic-level 2.x. Standalone Node avoids
          # Electron ABI differences and keeps native dependencies outside the ASAR.
          npm install --prefix $bridge --no-audit --no-fund --omit=dev 'classic-level@2.0.0'
          if($LASTEXITCODE -ne 0){throw 'Hydra LevelDB reader dependencies failed to install'}
          $env:RAMPAGE_HYDRA_READER="$bridge\reader.js"
          $env:RAMPAGE_HYDRA_NODE="$bridge\node.exe"
          $env:RAMPAGE_HYDRA_TEST='1'
          & "$bridge\node.exe" --test 'tests/hydra-remote.test.js'
          if($LASTEXITCODE -ne 0){throw 'Hydra reader and metadata integration security tests failed'}
          if(!(Test-Path "$bridge\node_modules\classic-level")){throw 'ClassicLevel dependency absent'}
          Write-Host 'Read-only Hydra integration tested with a real LevelDB fixture'

      - name: Build Windows updater-compatible installer
        run: |
          $ErrorActionPreference = 'Stop'
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS install failed' }
          $script = Get-Content '.github/patches/rampage-0.2.5-installer.nsi' -Raw
          if (!$script.Contains('/RELAUNCH') -or !$script.Contains('installed-build.txt') -or
              !$script.Contains('Preserve $APPDATA')) { throw 'Base installer lacks safe update facilities' }
          $script = $script.Replace('0.2.5','1.6.2').Replace('0.2 Beta','1.6 Beta')
          $script = $script.Replace('RAMpage-Setup-0.2.exe','RAMpage-Setup-1.6.2.exe')
          $script = $script.Replace('..\..\dist\','dist\')
          if (!$script.Contains('VIProductVersion "1.6.2.0"') -or
              !$script.Contains('FileWrite $0 "1.6.2"')) { throw 'Version substitution failed' }
          [System.IO.File]::WriteAllText('rampage-1.6-installer.nsi',$script)
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (!(Test-Path $nsis)) { $nsis = (Get-Command makensis -ErrorAction Stop).Source }
          & $nsis -V3 -INPUTCHARSET UTF8 'rampage-1.6-installer.nsi'
          if ($LASTEXITCODE -ne 0) { throw 'NSIS compilation failed' }
          $file = 'dist\RAMpage-Setup-1.6.2.exe'
          if (!(Test-Path $file) -or (Get-Item $file).Length -lt 100000000) {
            throw 'New installer invalid or unexpectedly small'
          }
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$file.sha256", "$hash  RAMpage-Setup-1.6.2.exe"+[Environment]::NewLine)
          Write-Host "Version 1.6.2 Windows installer SHA256: $hash"

      - name: Test real 1.6.1 to 1.6.2 in-place silent install on Windows
        run: |
          $ErrorActionPreference = 'Stop'
          $installed = "$env:LOCALAPPDATA\Programs\RAMpage"
          $roaming = "$env:APPDATA\RAMpage"
          $local = "$env:LOCALAPPDATA\RAMpage\data"
          New-Item -Type Directory -Force $roaming,$local | Out-Null
          $marker = [guid]::NewGuid().ToString()
          Set-Content "$roaming\upgrade-sentinel.txt" $marker
          Set-Content "$local\upgrade-sentinel.txt" $marker
          $oldInstall = Start-Process "$env:RUNNER_TEMP\old\RAMpage-Setup-1.6.1.exe" -ArgumentList '/S' -Wait -PassThru
          if ($oldInstall.ExitCode -ne 0) { throw "Old install failed with $($oldInstall.ExitCode)" }
          if (!(Test-Path "$installed\RAMpage.exe")) { throw 'v1.6.1 installation missing' }
          $upgrade = Start-Process "$env:GITHUB_WORKSPACE\dist\RAMpage-Setup-1.6.2.exe" -ArgumentList '/S' -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) { throw "v1.6.2 update failed with $($upgrade.ExitCode)" }
          if ((Get-Content "$installed\installed-build.txt" -Raw).Trim() -ne '1.6.2') {
            throw 'Installed-build marker is incorrect'
          }
          & npx --yes '@electron/asar@3.4.1' extract "$installed\resources\app.asar" "$env:RUNNER_TEMP\installed"
          if ($LASTEXITCODE -ne 0) { throw 'Installed app.asar cannot be verified' }
          $installedVer = (Get-Content "$env:RUNNER_TEMP\installed\package.json" -Raw | ConvertFrom-Json).version
          if ($installedVer -ne '1.6.2') { throw "Installed application version is $installedVer" }
          if(!(Test-Path "$installed\tools\cloudflared.exe")){throw 'Bundled Cloudflare tool missing'}
          $tunnelHash=(Get-FileHash "$installed\tools\cloudflared.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          if($tunnelHash -ne '4d2490e74082c5d48dbfedaf92576fa5bd1702379ab88eb7faa0cfbe8dc891b6'){throw 'Installed tunnelling executable digest mismatch'}
          if(!(Test-Path "$env:RUNNER_TEMP\installed\src\remote-quick-tunnel.js")){throw 'Installed app missing Quick Tunnel manager'}
          if(!(Test-Path "$installed\tools\cloudflared.exe")){throw 'Previous secure remote access functionality not preserved'}
          if(!(Test-Path "$installed\tools\hydra-bridge\node.exe") -or
             !(Test-Path "$installed\tools\hydra-bridge\reader.js")){throw 'Hydra reader absent from installed app'}
          if(!(Test-Path "$env:RUNNER_TEMP\installed\src\hydra-remote-provider.js")){throw 'Hydra opt-in module absent from packaged app'}
          $mainInstalled=[System.IO.File]::ReadAllText("$env:RUNNER_TEMP\installed\src\main.js")
          if(!$mainInstalled.Contains("ipcMain.handle('hydra:remote-configure'")){throw 'Desktop Hydra opt-in missing'}
          foreach ($dir in @($roaming,$local)) {
            if ((Get-Content "$dir\upgrade-sentinel.txt" -Raw).Trim() -ne $marker) {
              throw "User data was changed or lost in $dir"
            }
          }
          Write-Host 'PASSED: in-place Windows upgrade 1.6.1 -> 1.6.2, app version, marker and user data preserved'

      - name: Publish version 1.6.2 only after installer tests pass
        run: |
          $ErrorActionPreference = 'Stop'
          $existing = gh release list --limit 100 --json tagName | ConvertFrom-Json
          if (@($existing | Where-Object { $_.tagName -eq 'v1.6.2' }).Count -gt 0) { throw 'Existing release may not be overwritten' }
          @'
          ## RAMpage 1.6.2 Beta — Opt-in Hydra Launcher integration

          Browse Hydra Launcher games through RAMpage's existing password-protected
          remote web library URL (including Cloudflare one-click sharing).

          In desktop RAMpage Settings > Remote library access > Hydra Launcher
          integration, select Enable Hydra integration, then Refresh Hydra games.
          The feature is **off by default**. It will attempt to detect the Hydra
          game database locally and read a temporary snapshot of its games.

          Hydra game data appears in the web library only after activation.
          Edit titles, descriptions, notes, genres, favourites and cover URLs
          remotely using the same RAMpage web editor. Edits are saved **only in
          RAMpage** as metadata overrides; the Hydra app and its database are
          NOT modified. Disabling integration hides Hydra games from the web.

          No game executables, ROM paths, account data, download sources, or
          credentials are exposed to browsers. The tool reads only Hydra's
          game-record sublevel; the full temporary database snapshot is removed.

          If Hydra's database changes while being read, sync may fail safely;
          retry or briefly close Hydra. Hydra's data is never written or deleted.

          RAMpage v1.6.1 one-click HTTPS link and ShadPS4 Quick Access retained.
          Automated Windows verification checks opt-in behavior, metadata
          persistence, Hydra LevelDB fixture, installation and user-data retention.
          '@ | Set-Content 'release-notes-v1.6.2-remote.md'
          gh release create v1.6.2 'dist/RAMpage-Setup-1.6.2.exe' 'dist/RAMpage-Setup-1.6.2.exe.sha256' --title 'RAMpage 1.6.2 Beta' --notes-file 'release-notes-v1.6.2-remote.md' --target main --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub publication failed' }

      - name: Verify published release through authenticated GitHub API
        run: |
          $ErrorActionPreference = 'Stop'
          $release = $null
          for ($i = 0; $i -lt 6; $i++) {
            $release = gh api "repos/$env:GH_REPO/releases/latest" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'GitHub release check failed' }
            if ($release.tag_name -eq 'v1.6.2') { break }
            Start-Sleep -Seconds 5
          }
          if ($release.tag_name -ne 'v1.6.2') { throw "Latest release is $($release.tag_name), not v1.6.2" }
          $exe = @($release.assets | Where-Object { $_.name -eq 'RAMpage-Setup-1.6.2.exe' })
          $sha = @($release.assets | Where-Object { $_.name -eq 'RAMpage-Setup-1.6.2.exe.sha256' })
          if ($exe.Count -ne 1 -or $sha.Count -ne 1 -or $exe[0].size -lt 100000000) {
            throw 'Latest-release installer or checksum is missing'
          }
          Write-Host 'PASS: v1.6.2 is latest release and installer+checksum are available'
