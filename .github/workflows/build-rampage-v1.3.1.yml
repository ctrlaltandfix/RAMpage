name: Build RAMpage 1.3.1 ShadPS4 Quick Access fix

on:
  push:
    branches: [chatgpt-build-v1.3.1]
    paths: ['.github/workflows/build-rampage-v1.3.1.yml', '.github/patches/quick-access-policy.js', 'tests/quick-access-policy.test.js']

permissions:
  contents: write

concurrency:
  group: rampage-shadps4-v1.3.1
  cancel-in-progress: false

jobs:
  test-build-publish:
    runs-on: windows-latest
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ensure release does not already exist
        run: |
          $existing = gh release list --limit 100 --json tagName | ConvertFrom-Json
          if (@($existing | Where-Object { $_.tagName -eq 'v1.3.1' }).Count -gt 0) { throw 'Release v1.3.1 already exists, refusing overwrite.' }

      - name: Download and verify official v1.3.0 release
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -Type Directory -Force "$env:RUNNER_TEMP\old" | Out-Null
          gh release download v1.3.0 --pattern 'RAMpage-Setup-1.3.exe' --dir "$env:RUNNER_TEMP\old"
          if ($LASTEXITCODE -ne 0) { throw 'Download v1.3.0 failed' }
          gh release download v1.3.0 --pattern 'RAMpage-Setup-1.3.exe.sha256' --dir "$env:RUNNER_TEMP\old"
          if ($LASTEXITCODE -ne 0) { throw 'Download v1.3.0 checksum failed' }
          $exe = "$env:RUNNER_TEMP\old\RAMpage-Setup-1.3.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '4ab5b0508c3e885b35597eff987701df4c2bb48841b66c5fa191cd59a1b75fe8') {
            throw "Unexpected source binary digest $hash"
          }
          $sum = [regex]::Match((Get-Content "$exe.sha256" -Raw),'(?i)[a-f0-9]{64}').Value.ToLowerInvariant()
          if ($sum -ne $hash) { throw 'Official release SHA-256 file mismatch' }
          Write-Host "Verified official v1.3.0 digest: $hash"

      - name: Repackage authentic v1.3.0 app as v1.3.1
        run: |
          $ErrorActionPreference = 'Stop'
          $expanded = "$env:RUNNER_TEMP\expanded"
          New-Item -ItemType Directory -Force $expanded | Out-Null
          & 7z x '-y' "-o$expanded" "$env:RUNNER_TEMP\old\RAMpage-Setup-1.3.exe"
          if ($LASTEXITCODE -ne 0) { throw '7z source-installer extraction failed' }
          $candidates = @(Get-ChildItem $expanded -Recurse -File -Filter 'RAMpage.exe' | Where-Object {
            Test-Path (Join-Path $_.DirectoryName 'resources\app.asar') })
          if ($candidates.Count -ne 1) { throw "Expected 1 Electron app, got $($candidates.Count)" }
          $target = "$env:GITHUB_WORKSPACE\dist\win-unpacked"
          New-Item -ItemType Directory -Force $target | Out-Null
          Copy-Item -Path "$($candidates[0].DirectoryName)\*" -Destination $target -Recurse -Force
          $unpacked = "$env:RUNNER_TEMP\source"
          & npx --yes '@electron/asar@3.4.1' extract "$target\resources\app.asar" $unpacked
          if ($LASTEXITCODE -ne 0) { throw 'ASAR extraction failed' }
          $manifest = "$unpacked\package.json"
          $pkg = Get-Content $manifest -Raw | ConvertFrom-Json
          if ($pkg.version -ne '1.3.0') { throw "Unexpected embedded version $($pkg.version)" }
          if ($pkg.updates.github -ne 'ctrlaltandfix/RAMpage') { throw 'Wrong in-app updater feed' }
          # Change only the known release baseline, never replace it with old code.
          $mainFile = Join-Path $unpacked 'src\main.js'
          $mainSha = (Get-FileHash $mainFile -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($mainSha -ne '3bb9d64fd167b5a311a9e095291486fdf0b5e472a5a10fd69500885a8b8f3a71') {
            throw "Unexpected v1.3.0 main.js SHA-256: $mainSha"
          }
          $mainText = [System.IO.File]::ReadAllText($mainFile)
          $needImport = "const sgdb = require('./steamgriddb');"
          $oldGate = 'if (g && g.systemId) return g;'
          if ($mainText.Split([string[]]@($needImport), [StringSplitOptions]::None).Length -ne 2 -or
              $mainText.Split([string[]]@($oldGate), [StringSplitOptions]::None).Length -ne 2) {
            throw 'Overlay policy patch preconditions failed, refusing to publish'
          }
          $mainText = $mainText.Replace($needImport, $needImport + [Environment]::NewLine + "const { requiresInAppQuickAccess } = require('./quick-access-policy');")
          $mainText = $mainText.Replace($oldGate, 'if (requiresInAppQuickAccess(g)) return g;')
          [System.IO.File]::WriteAllText($mainFile, $mainText)
          Copy-Item '.github/patches/quick-access-policy.js' (Join-Path $unpacked 'src\quick-access-policy.js')
          if (!(Select-String -Path $mainFile -Pattern 'if \(requiresInAppQuickAccess\(g\)\) return g;' -Quiet)) {
            throw 'Quick Access emulator policy replacement not applied'
          }
          node --test 'tests/quick-access-policy.test.js'
          if ($LASTEXITCODE -ne 0) { throw 'Quick Access regression test failure' }
          $pkg.version = '1.3.1'
          [System.IO.File]::WriteAllText($manifest, ($pkg | ConvertTo-Json -Depth 100))
          foreach ($source in @('src\main.js','src\quick-access-policy.js','src\storage.js','src\updater.js','src\renderer\app.js')) {
            & node --check "$unpacked\$source"
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax check failed: $source" }
          }
          & npx --yes '@electron/asar@3.4.1' pack $unpacked "$target\resources\app.asar"
          if ($LASTEXITCODE -ne 0) { throw 'ASAR repack failed' }
          & npx --yes '@electron/asar@3.4.1' extract "$target\resources\app.asar" "$env:RUNNER_TEMP\verify"
          if ($LASTEXITCODE -ne 0) { throw 'ASAR verification extract failed' }
          $checkVer = (Get-Content "$env:RUNNER_TEMP\verify\package.json" -Raw | ConvertFrom-Json).version
          if ($checkVer -ne '1.3.1') { throw "Repacked application version was $checkVer" }
          Write-Host "Repacked official Electron app with new version: $checkVer"

      - name: Build Windows updater-compatible installer
        run: |
          $ErrorActionPreference = 'Stop'
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS install failed' }
          $script = Get-Content '.github/patches/rampage-0.2.5-installer.nsi' -Raw
          if (!$script.Contains('/RELAUNCH') -or !$script.Contains('installed-build.txt') -or
              !$script.Contains('Preserve $APPDATA')) { throw 'Base installer lacks safe update facilities' }
          $script = $script.Replace('0.2.5','1.3.1').Replace('0.2 Beta','1.3 Beta')
          $script = $script.Replace('RAMpage-Setup-0.2.exe','RAMpage-Setup-1.3.1.exe')
          $script = $script.Replace('..\..\dist\','dist\')
          if (!$script.Contains('VIProductVersion "1.3.1.0"') -or
              !$script.Contains('FileWrite $0 "1.3.1"')) { throw 'Version substitution failed' }
          [System.IO.File]::WriteAllText('rampage-1.3.1-installer.nsi',$script)
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (!(Test-Path $nsis)) { $nsis = (Get-Command makensis -ErrorAction Stop).Source }
          & $nsis -V3 -INPUTCHARSET UTF8 'rampage-1.3.1-installer.nsi'
          if ($LASTEXITCODE -ne 0) { throw 'NSIS compilation failed' }
          $file = 'dist\RAMpage-Setup-1.3.1.exe'
          if (!(Test-Path $file) -or (Get-Item $file).Length -lt 100000000) {
            throw 'New installer invalid or unexpectedly small'
          }
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$file.sha256", "$hash  RAMpage-Setup-1.3.1.exe"+[Environment]::NewLine)
          Write-Host "Version 1.3 Windows installer SHA256: $hash"

      - name: Test real 1.3.0 to 1.3.1 in-place silent install on Windows
        run: |
          $ErrorActionPreference = 'Stop'
          $installed = "$env:LOCALAPPDATA\Programs\RAMpage"
          $roaming = "$env:APPDATA\RAMpage"
          $local = "$env:LOCALAPPDATA\RAMpage\data"
          New-Item -Type Directory -Force $roaming,$local | Out-Null
          $marker = [guid]::NewGuid().ToString()
          Set-Content "$roaming\upgrade-sentinel.txt" $marker
          Set-Content "$local\upgrade-sentinel.txt" $marker
          $oldInstall = Start-Process "$env:RUNNER_TEMP\old\RAMpage-Setup-1.3.exe" -ArgumentList '/S' -Wait -PassThru
          if ($oldInstall.ExitCode -ne 0) { throw "Old install failed with $($oldInstall.ExitCode)" }
          if (!(Test-Path "$installed\RAMpage.exe")) { throw 'v1.3.0 installation missing' }
          $upgrade = Start-Process "$env:GITHUB_WORKSPACE\dist\RAMpage-Setup-1.3.1.exe" -ArgumentList '/S' -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) { throw "v1.3.1 update failed with $($upgrade.ExitCode)" }
          if ((Get-Content "$installed\installed-build.txt" -Raw).Trim() -ne '1.3.1') {
            throw 'Installed-build marker is incorrect'
          }
          & npx --yes '@electron/asar@3.4.1' extract "$installed\resources\app.asar" "$env:RUNNER_TEMP\installed"
          if ($LASTEXITCODE -ne 0) { throw 'Installed app.asar cannot be verified' }
          $installedVer = (Get-Content "$env:RUNNER_TEMP\installed\package.json" -Raw | ConvertFrom-Json).version
          if ($installedVer -ne '1.3.1') { throw "Installed application version is $installedVer" }
          foreach ($dir in @($roaming,$local)) {
            if ((Get-Content "$dir\upgrade-sentinel.txt" -Raw).Trim() -ne $marker) {
              throw "User data was changed or lost in $dir"
            }
          }
          Write-Host 'PASSED: in-place Windows upgrade 1.3.0 -> 1.3.1, app version, marker and user data preserved'

      - name: Publish version 1.3.1 only after installer tests pass
        run: |
          $ErrorActionPreference = 'Stop'
          $existing = gh release list --limit 100 --json tagName | ConvertFrom-Json
          if (@($existing | Where-Object { $_.tagName -eq 'v1.3.1' }).Count -gt 0) { throw 'Existing release may not be overwritten' }
          @'
          ## RAMpage 1.3.1 Beta — ShadPS4 Quick Access toolbar fix

          PS4 games run with shadPS4 now attempt the same floating Quick Access
          toolbar used for PC games rather than automatically opening it in RAMpage.
          Use Home or the configured controller button.

          Other emulators retain their existing fallback and other games are unchanged.
          If ShadPS4 hides ordinary Windows overlays, try Borderless Fullscreen
          or Windowed display mode.

          Rebuilt from the verified official v1.3.0 application. The Windows CI
          tests syntax, policy regressions, version, actual 1.3.0-to-1.3.1
          installation, and preserves both local game-data locations.
          '@ | Set-Content 'release-notes-v1.3.1.md'
          gh release create v1.3.1 'dist/RAMpage-Setup-1.3.1.exe' 'dist/RAMpage-Setup-1.3.1.exe.sha256' --title 'RAMpage 1.3.1 Beta' --notes-file 'release-notes-v1.3.1.md' --target main --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub publication failed' }

      - name: Verify published release through authenticated GitHub API
        run: |
          $ErrorActionPreference = 'Stop'
          $release = $null
          for ($i = 0; $i -lt 6; $i++) {
            $release = gh api "repos/$env:GH_REPO/releases/latest" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'GitHub release check failed' }
            if ($release.tag_name -eq 'v1.3.1') { break }
            Start-Sleep -Seconds 5
          }
          if ($release.tag_name -ne 'v1.3.1') { throw "Latest release is $($release.tag_name), not v1.3.1" }
          $exe = @($release.assets | Where-Object { $_.name -eq 'RAMpage-Setup-1.3.1.exe' })
          $sha = @($release.assets | Where-Object { $_.name -eq 'RAMpage-Setup-1.3.1.exe.sha256' })
          if ($exe.Count -ne 1 -or $sha.Count -ne 1 -or $exe[0].size -lt 100000000) {
            throw 'Latest-release installer or checksum is missing'
          }
          Write-Host 'PASS: v1.3.1 is latest release and installer+checksum are available'
