name: Test and publish RAMpage 1.3 Beta

on:
  push:
    branches: [chatgpt-build-v1.3.0]
    paths: ['.github/workflows/build-rampage-v1.3.0.yml']

permissions:
  contents: write

concurrency:
  group: rampage-1.3-test-release
  cancel-in-progress: false

jobs:
  test-build-publish:
    runs-on: windows-latest
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ensure release does not already exist
        run: |
          gh release view v1.3.0 *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release v1.3.0 already exists, refusing overwrite.' }

      - name: Download and verify official v1.2.27 release
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -Type Directory -Force "$env:RUNNER_TEMP\old" | Out-Null
          gh release download v1.2.27 --pattern 'RAMpage-Setup-1.2.exe' --dir "$env:RUNNER_TEMP\old"
          if ($LASTEXITCODE -ne 0) { throw 'Download v1.2.27 failed' }
          gh release download v1.2.27 --pattern 'RAMpage-Setup-1.2.exe.sha256' --dir "$env:RUNNER_TEMP\old"
          if ($LASTEXITCODE -ne 0) { throw 'Download v1.2.27 checksum failed' }
          $exe = "$env:RUNNER_TEMP\old\RAMpage-Setup-1.2.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '9c31cfdea0aea2f8ad2d1e98782f6372e1063cae9022fbc654a17341a5d6bf1f') {
            throw "Unexpected source binary digest $hash"
          }
          $sum = [regex]::Match((Get-Content "$exe.sha256" -Raw),'(?i)[a-f0-9]{64}').Value.ToLowerInvariant()
          if ($sum -ne $hash) { throw 'Official release SHA-256 file mismatch' }
          Write-Host "Verified official v1.2.27 digest: $hash"

      - name: Repackage authentic v1.2.27 app as v1.3.0
        run: |
          $ErrorActionPreference = 'Stop'
          $expanded = "$env:RUNNER_TEMP\expanded"
          New-Item -ItemType Directory -Force $expanded | Out-Null
          & 7z x '-y' "-o$expanded" "$env:RUNNER_TEMP\old\RAMpage-Setup-1.2.exe"
          if ($LASTEXITCODE -ne 0) { throw '7z source-installer extraction failed' }
          $candidates = @(Get-ChildItem $expanded -Recurse -File -Filter 'RAMpage.exe' | Where-Object {
            Test-Path (Join-Path $_.DirectoryName 'resources\app.asar') })
          if ($candidates.Count -ne 1) { throw "Expected 1 Electron app, got $($candidates.Count)" }
          $target = "$env:GITHUB_WORKSPACE\dist\win-unpacked"
          New-Item -ItemType Directory -Force $target | Out-Null
          Copy-Item -Path "$($candidates[0].DirectoryName)\*" -Destination $target -Recurse -Force
          $unpacked = "$env:RUNNER_TEMP\source"
          & npx --yes '@electron/asar@3.4.1' extract "$target\resources\app.asar" $unpacked
          if ($LASTEXITCODE -ne 0) { throw 'ASAR extraction failed' }
          $manifest = "$unpacked\package.json"
          $pkg = Get-Content $manifest -Raw | ConvertFrom-Json
          if ($pkg.version -ne '1.2.27') { throw "Unexpected embedded version $($pkg.version)" }
          if ($pkg.updates.github -ne 'ctrlaltandfix/RAMpage') { throw 'Wrong in-app updater feed' }
          $pkg.version = '1.3.0'
          [System.IO.File]::WriteAllText($manifest, ($pkg | ConvertTo-Json -Depth 100))
          foreach ($source in @('src\main.js','src\storage.js','src\updater.js','src\renderer\app.js')) {
            & node --check "$unpacked\$source"
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax check failed: $source" }
          }
          & npx --yes '@electron/asar@3.4.1' pack $unpacked "$target\resources\app.asar"
          if ($LASTEXITCODE -ne 0) { throw 'ASAR repack failed' }
          & npx --yes '@electron/asar@3.4.1' extract "$target\resources\app.asar" "$env:RUNNER_TEMP\verify"
          if ($LASTEXITCODE -ne 0) { throw 'ASAR verification extract failed' }
          $checkVer = (Get-Content "$env:RUNNER_TEMP\verify\package.json" -Raw | ConvertFrom-Json).version
          if ($checkVer -ne '1.3.0') { throw "Repacked application version was $checkVer" }
          Write-Host "Repacked official Electron app with new version: $checkVer"

      - name: Build Windows updater-compatible installer
        run: |
          $ErrorActionPreference = 'Stop'
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS install failed' }
          $script = Get-Content '.github/patches/rampage-0.2.5-installer.nsi' -Raw
          if (!$script.Contains('/RELAUNCH') -or !$script.Contains('installed-build.txt') -or
              !$script.Contains('Preserve $APPDATA')) { throw 'Base installer lacks safe update facilities' }
          $script = $script.Replace('0.2.5','1.3.0').Replace('0.2 Beta','1.3 Beta')
          $script = $script.Replace('RAMpage-Setup-0.2.exe','RAMpage-Setup-1.3.exe')
          $script = $script.Replace('..\..\dist\','dist\')
          if (!$script.Contains('VIProductVersion "1.3.0.0"') -or
              !$script.Contains('FileWrite $0 "1.3.0"')) { throw 'Version substitution failed' }
          [System.IO.File]::WriteAllText('rampage-1.3-installer.nsi',$script)
          $nsis = '${env:ProgramFiles(x86)}\NSIS\makensis.exe'
          if (!(Test-Path $nsis)) { $nsis = (Get-Command makensis -ErrorAction Stop).Source }
          & $nsis -V3 -INPUTCHARSET UTF8 'rampage-1.3-installer.nsi'
          if ($LASTEXITCODE -ne 0) { throw 'NSIS compilation failed' }
          $file = 'dist\RAMpage-Setup-1.3.exe'
          if (!(Test-Path $file) -or (Get-Item $file).Length -lt 100000000) {
            throw 'New installer invalid or unexpectedly small'
          }
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$file.sha256", "$hash  RAMpage-Setup-1.3.exe"+[Environment]::NewLine)
          Write-Host "Version 1.3 Windows installer SHA256: $hash"

      - name: Test real 1.2.27 to 1.3.0 in-place silent install on Windows
        run: |
          $ErrorActionPreference = 'Stop'
          $installed = "$env:LOCALAPPDATA\Programs\RAMpage"
          $roaming = "$env:APPDATA\RAMpage"
          $local = "$env:LOCALAPPDATA\RAMpage\data"
          New-Item -Type Directory -Force $roaming,$local | Out-Null
          $marker = [guid]::NewGuid().ToString()
          Set-Content "$roaming\upgrade-sentinel.txt" $marker
          Set-Content "$local\upgrade-sentinel.txt" $marker
          $oldInstall = Start-Process "$env:RUNNER_TEMP\old\RAMpage-Setup-1.2.exe" -ArgumentList '/S' -Wait -PassThru
          if ($oldInstall.ExitCode -ne 0) { throw "Old install failed with $($oldInstall.ExitCode)" }
          if (!(Test-Path "$installed\RAMpage.exe")) { throw 'v1.2.27 installation missing' }
          $upgrade = Start-Process "$env:GITHUB_WORKSPACE\dist\RAMpage-Setup-1.3.exe" -ArgumentList '/S' -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) { throw "v1.3.0 update failed with $($upgrade.ExitCode)" }
          if ((Get-Content "$installed\installed-build.txt" -Raw).Trim() -ne '1.3.0') {
            throw 'Installed-build marker is incorrect'
          }
          & npx --yes '@electron/asar@3.4.1' extract "$installed\resources\app.asar" "$env:RUNNER_TEMP\installed"
          if ($LASTEXITCODE -ne 0) { throw 'Installed app.asar cannot be verified' }
          $installedVer = (Get-Content "$env:RUNNER_TEMP\installed\package.json" -Raw | ConvertFrom-Json).version
          if ($installedVer -ne '1.3.0') { throw "Installed application version is $installedVer" }
          foreach ($dir in @($roaming,$local)) {
            if ((Get-Content "$dir\upgrade-sentinel.txt" -Raw).Trim() -ne $marker) {
              throw "User data was changed or lost in $dir"
            }
          }
          Write-Host 'PASSED: in-place Windows upgrade 1.2.27 -> 1.3.0, app version, marker and user data preserved'

      - name: Publish version 1.3.0 only after installer tests pass
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view v1.3.0 *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Existing release may not be overwritten' }
          @'
          ## RAMpage 1.3 Beta — update verification release

          Version-only update based on verified official RAMpage v1.2.27 packaged application.
          Application features and JavaScript code are unchanged; embedded application version is now 1.3.0.

          Windows Actions validation covers the official source checksum, packaged app version,
          installer build, in-place silent upgrade and preservation of sample user data.
          The installer uses the established compatible per-user NSIS update template,
          with a simpler setup wizard than the previous installer.

          Open Settings → Check for updates in RAMpage 1.2.27 to discover version 1.3,
          download it with SHA-256 verification and restart into the new build.
          '@ | Set-Content 'release-notes-v1.3.md'
          gh release create v1.3.0 'dist/RAMpage-Setup-1.3.exe' 'dist/RAMpage-Setup-1.3.exe.sha256' --title 'RAMpage 1.3 Beta' --notes-file 'release-notes-v1.3.md' --target main --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub publication failed' }

      - name: Validate live GitHub in-app updater feed
        run: |
          $ErrorActionPreference = 'Stop'
          $release = $null
          for ($i=0; $i -lt 6; $i++) {
            $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/ctrlaltandfix/RAMpage/releases/latest' -Headers @{
              'User-Agent'='RAMpage/1.2.27'; 'Accept'='application/vnd.github+json' }
            if ($release.tag_name -eq 'v1.3.0') { break }
            Start-Sleep -Seconds 5
          }
          if ($release.tag_name -ne 'v1.3.0') { throw "Latest release still $($release.tag_name), expected v1.3.0" }
          $exe = @($release.assets | Where-Object { $_.name -eq 'RAMpage-Setup-1.3.exe' })
          $sha = @($release.assets | Where-Object { $_.name -eq 'RAMpage-Setup-1.3.exe.sha256' })
          if ($exe.Count -ne 1 -or $sha.Count -ne 1 -or $exe[0].size -lt 100000000) {
            throw 'Updater-required installer/checksum assets missing or invalid'
          }
          Write-Host "LIVE UPDATE FEED PASSED: v1.3.0, $($exe[0].name), SHA-256 file available"
          Write-Host "$($release.html_url)"
