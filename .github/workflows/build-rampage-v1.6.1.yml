name: RAMpage v1.6.1 One-Click Remote Library HTTPS

on:
  push:
    branches: [chatgpt-easy-remote-library-v1.6.1]
    paths: ['.github/workflows/build-rampage-v1.6.1.yml']

permissions:
  contents: write

concurrency:
  group: rampage-one-click-v1.6.1
  cancel-in-progress: false

jobs:
  test-build-publish:
    runs-on: windows-latest
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check new tunnel source and integration script
        run: |
          $ErrorActionPreference='Stop'
          foreach($f in @('src\remote-quick-tunnel.js','scripts\apply-easy-remote.js','tests\remote-quick-tunnel.test.js')) {
            node --check $f
            if($LASTEXITCODE -ne 0){throw "Syntax validation failed $f"}
          }

      - name: Ensure release does not already exist
        run: |
          $existing = gh release list --limit 100 --json tagName | ConvertFrom-Json
          if (@($existing | Where-Object { $_.tagName -eq 'v1.6.1' }).Count -gt 0) { throw 'Release v1.6.1 already exists, refusing overwrite.' }

      - name: Download and verify official v1.6.0 release
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -Type Directory -Force "$env:RUNNER_TEMP\old" | Out-Null
          gh release download v1.6.0 --pattern 'RAMpage-Setup-1.6.exe' --dir "$env:RUNNER_TEMP\old"
          if ($LASTEXITCODE -ne 0) { throw 'Download v1.6.0 failed' }
          gh release download v1.6.0 --pattern 'RAMpage-Setup-1.6.exe.sha256' --dir "$env:RUNNER_TEMP\old"
          if ($LASTEXITCODE -ne 0) { throw 'Download v1.6.0 checksum failed' }
          $exe = "$env:RUNNER_TEMP\old\RAMpage-Setup-1.6.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '273d0dd262749555993e6707f93557dd9833c4ffc69bf110f77ff8bee39abe85') {
            throw "Unexpected source binary digest $hash"
          }
          $sum = [regex]::Match((Get-Content "$exe.sha256" -Raw),'(?i)[a-f0-9]{64}').Value.ToLowerInvariant()
          if ($sum -ne $hash) { throw 'Official release SHA-256 file mismatch' }
          Write-Host "Verified official v1.6.0 digest: $hash"

      - name: Repackage authentic v1.6.0 app as v1.6.1
        run: |
          $ErrorActionPreference = 'Stop'
          $expanded = "$env:RUNNER_TEMP\expanded"
          New-Item -ItemType Directory -Force $expanded | Out-Null
          & 7z x '-y' "-o$expanded" "$env:RUNNER_TEMP\old\RAMpage-Setup-1.6.exe"
          if ($LASTEXITCODE -ne 0) { throw '7z source-installer extraction failed' }
          $candidates = @(Get-ChildItem $expanded -Recurse -File -Filter 'RAMpage.exe' | Where-Object {
            Test-Path (Join-Path $_.DirectoryName 'resources\app.asar') })
          if ($candidates.Count -ne 1) { throw "Expected 1 Electron app, got $($candidates.Count)" }
          $target = "$env:GITHUB_WORKSPACE\dist\win-unpacked"
          New-Item -ItemType Directory -Force $target | Out-Null
          Copy-Item -Path "$($candidates[0].DirectoryName)\*" -Destination $target -Recurse -Force
          $unpacked = "$env:RUNNER_TEMP\source"
          & npx --yes '@electron/asar@3.4.1' extract "$target\resources\app.asar" $unpacked
          if ($LASTEXITCODE -ne 0) { throw 'ASAR extraction failed' }
          $manifest = "$unpacked\package.json"
          $pkg = Get-Content $manifest -Raw | ConvertFrom-Json
          if ($pkg.version -ne '1.6.0') { throw "Unexpected embedded version $($pkg.version)" }
          if ($pkg.updates.github -ne 'ctrlaltandfix/RAMpage') { throw 'Wrong in-app updater feed' }
          $oldMain=[System.IO.File]::ReadAllText((Join-Path $unpacked 'src\main.js'))
          if(!$oldMain.Contains('ShadPS4 foreground release result: ') -or
             !$oldMain.Contains("ipcMain.handle('remote:configure'")){throw 'Official v1.6.0 app missing expected features'}
          node 'scripts/apply-easy-remote.js' $unpacked
          if($LASTEXITCODE -ne 0){throw 'Remote tunnel patch failed'}
          if(!(Test-Path "$unpacked\src\remote-quick-tunnel.js")){throw 'Tunnel manager source missing'}
          Copy-Item "$unpacked\src\remote-library.js" 'src\remote-library.js'
          node --test 'tests/remote-quick-tunnel.test.js'
          if($LASTEXITCODE -ne 0){throw 'Remote tunnel security/lifecycle unit tests failed'}
          $newMain=[System.IO.File]::ReadAllText((Join-Path $unpacked 'src\main.js'))
          if(!$newMain.Contains('ShadPS4 foreground release result: ') -or
             !$newMain.Contains("ipcMain.handle('remote:tunnel-start'") -or
             !$newMain.Contains("ipcMain.handle('remote:configure'")){throw 'Other functions lost during patch'}
          $pkg.version = '1.6.1'
          [System.IO.File]::WriteAllText($manifest, ($pkg | ConvertTo-Json -Depth 100))
          foreach ($source in @('src\remote-quick-tunnel.js','src\main.js','src\remote-library.js','src\remote\client.js','src\preload.js','src\quick-access-presenter.js','src\quick-access-policy.js','src\storage.js','src\updater.js','src\renderer\app.js')) {
            & node --check "$unpacked\$source"
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax check failed: $source" }
          }
          & npx --yes '@electron/asar@3.4.1' pack $unpacked "$target\resources\app.asar"
          if ($LASTEXITCODE -ne 0) { throw 'ASAR repack failed' }
          & npx --yes '@electron/asar@3.4.1' extract "$target\resources\app.asar" "$env:RUNNER_TEMP\verify"
          if ($LASTEXITCODE -ne 0) { throw 'ASAR verification extract failed' }
          $checkVer = (Get-Content "$env:RUNNER_TEMP\verify\package.json" -Raw | ConvertFrom-Json).version
          if ($checkVer -ne '1.6.1') { throw "Repacked application version was $checkVer" }
          $verifyMain=[System.IO.File]::ReadAllText("$env:RUNNER_TEMP\verify\src\main.js")
          if (!$verifyMain.Contains("ipcMain.handle('remote:tunnel-start'") -or
              !$verifyMain.Contains("ipcMain.handle('remote:configure'") -or
              !(Test-Path "$env:RUNNER_TEMP\verify\src\remote\index.html")) {
            throw 'Remote library was not embedded in the Electron ASAR'
          }
          $verifyText = [System.IO.File]::ReadAllText("$env:RUNNER_TEMP\verify\src\main.js")
          if (!$verifyText.Contains('ShadPS4 foreground release result: ')) { throw 'Packaged v1.6.1 lost the ShadPS4 fix' }
          Write-Host "Repacked verified ShadPS4-fixed Electron app with new version: $checkVer"

      - name: Bundle the verified Cloudflare Quick Tunnel executable
        run: |
          $ErrorActionPreference='Stop'
          $toolDir="$env:GITHUB_WORKSPACE\dist\win-unpacked\tools"
          New-Item -ItemType Directory -Force $toolDir | Out-Null
          gh release download 2026.10.1 --repo cloudflare/cloudflared --pattern 'cloudflared-windows-amd64.exe' --dir $toolDir
          if($LASTEXITCODE -ne 0){throw 'Cloudflare binary download failed'}
          $original=Join-Path $toolDir 'cloudflared-windows-amd64.exe'
          $actual=(Get-FileHash $original -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -ne '4d2490e74082c5d48dbfedaf92576fa5bd1702379ab88eb7faa0cfbe8dc891b6'){throw "Untrusted tunnel executable SHA256: $actual"}
          Move-Item $original (Join-Path $toolDir 'cloudflared.exe')
          Write-Host 'Pinned official cloudflared packaged without separate install'

      - name: Build Windows updater-compatible installer
        run: |
          $ErrorActionPreference = 'Stop'
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS install failed' }
          $script = Get-Content '.github/patches/rampage-0.2.5-installer.nsi' -Raw
          if (!$script.Contains('/RELAUNCH') -or !$script.Contains('installed-build.txt') -or
              !$script.Contains('Preserve $APPDATA')) { throw 'Base installer lacks safe update facilities' }
          $script = $script.Replace('0.2.5','1.6.1').Replace('0.2 Beta','1.6 Beta')
          $script = $script.Replace('RAMpage-Setup-0.2.exe','RAMpage-Setup-1.6.1.exe')
          $script = $script.Replace('..\..\dist\','dist\')
          if (!$script.Contains('VIProductVersion "1.6.1.0"') -or
              !$script.Contains('FileWrite $0 "1.6.1"')) { throw 'Version substitution failed' }
          [System.IO.File]::WriteAllText('rampage-1.6-installer.nsi',$script)
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (!(Test-Path $nsis)) { $nsis = (Get-Command makensis -ErrorAction Stop).Source }
          & $nsis -V3 -INPUTCHARSET UTF8 'rampage-1.6-installer.nsi'
          if ($LASTEXITCODE -ne 0) { throw 'NSIS compilation failed' }
          $file = 'dist\RAMpage-Setup-1.6.1.exe'
          if (!(Test-Path $file) -or (Get-Item $file).Length -lt 100000000) {
            throw 'New installer invalid or unexpectedly small'
          }
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$file.sha256", "$hash  RAMpage-Setup-1.6.1.exe"+[Environment]::NewLine)
          Write-Host "Version 1.6.1 Windows installer SHA256: $hash"

      - name: Test real 1.6.0 to 1.6.1 in-place silent install on Windows
        run: |
          $ErrorActionPreference = 'Stop'
          $installed = "$env:LOCALAPPDATA\Programs\RAMpage"
          $roaming = "$env:APPDATA\RAMpage"
          $local = "$env:LOCALAPPDATA\RAMpage\data"
          New-Item -Type Directory -Force $roaming,$local | Out-Null
          $marker = [guid]::NewGuid().ToString()
          Set-Content "$roaming\upgrade-sentinel.txt" $marker
          Set-Content "$local\upgrade-sentinel.txt" $marker
          $oldInstall = Start-Process "$env:RUNNER_TEMP\old\RAMpage-Setup-1.6.exe" -ArgumentList '/S' -Wait -PassThru
          if ($oldInstall.ExitCode -ne 0) { throw "Old install failed with $($oldInstall.ExitCode)" }
          if (!(Test-Path "$installed\RAMpage.exe")) { throw 'v1.6.0 installation missing' }
          $upgrade = Start-Process "$env:GITHUB_WORKSPACE\dist\RAMpage-Setup-1.6.1.exe" -ArgumentList '/S' -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) { throw "v1.6.1 update failed with $($upgrade.ExitCode)" }
          if ((Get-Content "$installed\installed-build.txt" -Raw).Trim() -ne '1.6.1') {
            throw 'Installed-build marker is incorrect'
          }
          & npx --yes '@electron/asar@3.4.1' extract "$installed\resources\app.asar" "$env:RUNNER_TEMP\installed"
          if ($LASTEXITCODE -ne 0) { throw 'Installed app.asar cannot be verified' }
          $installedVer = (Get-Content "$env:RUNNER_TEMP\installed\package.json" -Raw | ConvertFrom-Json).version
          if ($installedVer -ne '1.6.1') { throw "Installed application version is $installedVer" }
          if(!(Test-Path "$installed\tools\cloudflared.exe")){throw 'Bundled Cloudflare tool missing'}
          $tunnelHash=(Get-FileHash "$installed\tools\cloudflared.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          if($tunnelHash -ne '4d2490e74082c5d48dbfedaf92576fa5bd1702379ab88eb7faa0cfbe8dc891b6'){throw 'Installed tunnelling executable digest mismatch'}
          if(!(Test-Path "$env:RUNNER_TEMP\installed\src\remote-quick-tunnel.js")){throw 'Installed app missing Quick Tunnel manager'}
          foreach ($dir in @($roaming,$local)) {
            if ((Get-Content "$dir\upgrade-sentinel.txt" -Raw).Trim() -ne $marker) {
              throw "User data was changed or lost in $dir"
            }
          }
          Write-Host 'PASSED: in-place Windows upgrade 1.6.0 -> 1.6.1, app version, marker and user data preserved'

      - name: Publish version 1.6.1 only after installer tests pass
        run: |
          $ErrorActionPreference = 'Stop'
          $existing = gh release list --limit 100 --json tagName | ConvertFrom-Json
          if (@($existing | Where-Object { $_.tagName -eq 'v1.6.1' }).Count -gt 0) { throw 'Existing release may not be overwritten' }
          @'
          ## RAMpage 1.6.1 Beta — Easier remote library access

          Browse and edit your entire RAMpage library on another device with
          one click, no Tailscale account, DNS, router changes, or separate app.

          Under Settings > Remote library access set your 16+ character
          password, enable the library, then click Create HTTPS link.
          Copy the generated temporary Cloudflare HTTPS URL to your other device.

          IMPORTANT: the generated HTTPS sign-in page is publicly reachable.
          A strong RAMpage password is still required to view or edit any games.
          Cloudflare Quick Tunnels are temporary, change URLs on restart, and
          have no uptime guarantee. RAMpage must remain running on your PC.

          Stop sharing immediately closes the URL. Remote metadata edits
          still use the existing authenticated RAMpage local library service.
          Existing ShadPS4 Quick Access and other game features are preserved.

          Windows CI tests security, official Cloudflare binary integrity,
          upgrades, metadata persistence and user data preservation.
          '@ | Set-Content 'release-notes-v1.6.1-remote.md'
          gh release create v1.6.1 'dist/RAMpage-Setup-1.6.1.exe' 'dist/RAMpage-Setup-1.6.1.exe.sha256' --title 'RAMpage 1.6.1 Beta' --notes-file 'release-notes-v1.6.1-remote.md' --target main --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub publication failed' }

      - name: Verify published release through authenticated GitHub API
        run: |
          $ErrorActionPreference = 'Stop'
          $release = $null
          for ($i = 0; $i -lt 6; $i++) {
            $release = gh api "repos/$env:GH_REPO/releases/latest" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'GitHub release check failed' }
            if ($release.tag_name -eq 'v1.6.1') { break }
            Start-Sleep -Seconds 5
          }
          if ($release.tag_name -ne 'v1.6.1') { throw "Latest release is $($release.tag_name), not v1.6.1" }
          $exe = @($release.assets | Where-Object { $_.name -eq 'RAMpage-Setup-1.6.1.exe' })
          $sha = @($release.assets | Where-Object { $_.name -eq 'RAMpage-Setup-1.6.1.exe.sha256' })
          if ($exe.Count -ne 1 -or $sha.Count -ne 1 -or $exe[0].size -lt 100000000) {
            throw 'Latest-release installer or checksum is missing'
          }
          Write-Host 'PASS: v1.6.1 is latest release and installer+checksum are available'
